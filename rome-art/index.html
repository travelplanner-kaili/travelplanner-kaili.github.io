<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>羅馬藝術觀｜推論脈絡</title>
<style>
[hidden]{display:none!important}
:root{color-scheme:light dark;
  --bg:#F6F2EA;--card:#FFFDF8;--ink:#2B2622;--ink2:#4A423B;--mute:#7A7068;--line:#E3DBCE;--soft:#EFE8DC;
  --anc:#B4533A;--med:#A8821C;--ren:#2F6EA8;--bar:#7D3F93;--aft:#6E7781;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --read:720px}
@media (prefers-color-scheme:dark){:root{
  --bg:#1A1816;--card:#24211E;--ink:#EDE6DC;--ink2:#D2C9BE;--mute:#A49A8F;--line:#3A3530;--soft:#2D2925;
  --anc:#E07A5F;--med:#D9B44A;--ren:#6FA8DC;--bar:#B57BCB;--aft:#9AA3AD;--shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px 0}
h1{font:700 21px/1.3 var(--serif);margin:0;letter-spacing:.5px}
nav{max-width:1180px;margin:0 auto;padding:4px 12px 0;display:flex;gap:2px}
nav button{border:0;background:none;padding:8px 14px 10px;font-size:16px;color:var(--mute);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);font-weight:700;border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
section.view{display:none} section.view.on{display:block}
.read{max-width:var(--read);margin-left:auto;margin-right:auto}
.lead{color:var(--ink2);font-size:16.5px;margin:0 auto 20px}
.h2{font:700 20px/1.4 var(--serif);margin:34px auto 12px}
/* flow: keys */
.preqa{max-width:820px;margin-bottom:8px}
.preqa .qb{display:none}.preqa .qi.open .qb{display:block}
.preqa .qt{cursor:pointer}
.fold{border:0;background:none;color:var(--ren);font-weight:700;font-size:15px;padding:2px 0 10px}
.preqa .qi.open .fold{order:2}
.preqa .chain{margin:-4px 0 18px}
.nextq{display:flex;gap:10px;align-items:flex-start;margin:30px 0 6px;max-width:820px}
.nextq .id{font:700 13px var(--sans);color:#fff;background:var(--ink);border-radius:6px;padding:1px 8px;margin-top:5px;white-space:nowrap}
.nextq h3{margin:0;font:700 21px/1.5 var(--serif)}
.t2{font:700 22px/1.4 var(--serif);margin:6px 0 6px}
.t2+.lead{margin-bottom:16px}
.t3{font:700 17px var(--serif);margin:6px 0 4px}
#v-flow .t2:not(:first-child){margin-top:36px}
.chain{display:flex;align-items:stretch;margin:0 0 8px;overflow-x:auto;padding-bottom:4px;max-width:820px}
.chain div{flex:1 0 auto;min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;color:var(--mute);box-shadow:var(--shadow)}
.chain div b{display:block;font:700 16px var(--serif);color:var(--ink)}
.chain span{align-self:center;padding:0 6px;color:var(--mute);font-size:18px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.key{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.key h3{margin:0 0 6px;font:700 18px var(--serif)} .key p{margin:0;font-size:15.5px;color:var(--ink2);line-height:1.75}
.key ul{margin:8px 0 0;padding-left:1.1em;font-size:15px;color:var(--ink2)} .key li{margin:3px 0}
#v-flow .lead{max-width:820px;margin-left:0}
@media (max-width:760px){.keys{grid-template-columns:1fr;gap:8px}}
/* flow: matrix */
.mx{display:grid;grid-template-columns:104px repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.mx>div{padding:12px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:14.5px;line-height:1.65;min-width:0}
.mx>div:nth-child(-n+6){border-top:0}
.mx>.rl{border-left:0;background:var(--soft);font-weight:700;font-size:13.5px;color:var(--mute)}
.eh{color:#fff;padding:14px 12px!important}
.eh b{display:block;font:700 20px var(--serif);letter-spacing:1px} .eh small{opacity:.92;font-size:13px}
.hg .ht{font-weight:700;font-size:13px;color:var(--c);margin-bottom:3px}
.hg{background:color-mix(in srgb,var(--c) 6%,var(--card))}
.pay b{display:block;font-size:15.5px}
.mx>.rl small{display:block;font-weight:400;font-size:12px}
.mx>.corner{font-size:12.5px}
.role{font-weight:700;color:var(--ink);font-size:15px}
.cue{color:var(--ink2)}
.hg .ht,.hg0 .ht{font-weight:700;font-size:13px;color:var(--c);margin-bottom:3px}
.eh small{display:block}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.tags span{background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-weight:700;border-radius:6px;padding:1px 8px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:flex-start}
.chip{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px 3px 8px;font-size:14px;display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.chip:hover,.qc:hover{border-color:var(--ink)}
.chip .d{width:9px;height:9px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.qc{border:1px solid transparent;background:var(--soft);border-radius:7px;padding:2px 8px;font-size:13.5px;font-weight:700;text-align:left;line-height:1.5}
.qc small{font-weight:400;color:var(--ink2);margin-left:4px}
.stk{display:none}.narrow-only{display:none}
@media (max-width:960px){.wide-only{display:none}.narrow-only{display:inline}}
@media (max-width:960px){.mx{display:none}.stk{display:block;max-width:var(--read);margin:0 auto}}
.ec{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.ec .row{padding:11px 14px;border-top:1px solid var(--line);font-size:16px}
.ec .row>i{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.hinge{margin:0 20px;padding:12px 14px 12px 18px;border-left:3px solid var(--c);position:relative;font-size:15.5px;background:color-mix(in srgb,var(--c) 6%,transparent)}
.hinge:before{content:"▼";position:absolute;left:-9px;bottom:-13px;color:var(--c);font-size:14px}
.hinge .ht{font-weight:700;color:var(--c);font-size:14px}
.gap{height:16px}
.stk .qc{display:block;margin:3px 0}
/* QA */
.qa-wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:104px;max-height:calc(100vh - 120px);overflow:auto;padding:0 6px 20px 0;border-right:1px solid var(--line)}
.side input,.qsearch{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font-size:15px;margin-bottom:12px}
.ol-sec{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px 4px;font:700 15px/1.45 var(--serif);color:var(--c);border-radius:8px}
.ol-q{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 8px 4px calc(8px + var(--dp,0)*14px);font-size:14px;line-height:1.5;color:var(--ink2);border-radius:6px}
.ol-q i{font-style:normal;font-weight:700;font-size:12px;color:var(--c);margin-right:5px}
.ol-q:hover,.ol-sec:hover{background:var(--soft)}
.ol-q.on{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);font-weight:600}
.ol-grp{margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.ol-grp.cur .ol-sec{background:color-mix(in srgb,var(--c) 10%,transparent)}
.qa-main{max-width:760px;min-width:0}
.intro{font-size:17px;line-height:1.9;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:0 0 24px;box-shadow:var(--shadow)}
.intro p{margin:0 0 8px} .intro p:last-child{margin:0}
.secbar{display:none}
.sech{font:700 25px/1.4 var(--serif);margin:0 0 6px;padding-bottom:10px;border-bottom:3px solid var(--c)}
.sech em{font-style:normal;color:var(--c);margin-right:6px}
.secnote{color:var(--mute);font-size:14px;margin:0 0 18px}
.qi{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;box-shadow:var(--shadow);padding:18px 22px 10px;scroll-margin-top:118px;border-top:4px solid var(--c)}
.qi.sub{border-top-width:1px;border-left:4px solid color-mix(in srgb,var(--c) 45%,transparent)}
.qi .from{font-size:12.5px;color:var(--mute);margin-bottom:2px}
.qi .qt{display:flex;gap:10px;align-items:flex-start}
.qi .id{font:700 13px var(--sans);color:#fff;background:var(--c,var(--mute));border-radius:6px;padding:1px 7px;margin-top:5px;white-space:nowrap}
.qi h3{margin:0;font:700 20px/1.55 var(--sans);color:var(--ink)}
.qi .sa{margin:10px 0 4px;font-size:17px;line-height:1.85;font-weight:600;color:var(--ink)}
.qb{padding:0;margin:0}
.qb h4{font-size:17px;margin:22px 0 6px;padding-left:10px;border-left:3px solid var(--c,var(--ink));line-height:1.5}
.qb p{margin:8px 0;font-size:16.5px;line-height:1.9;color:var(--ink2)}
.qb ul,.qb ol{margin:8px 0 10px;padding-left:1.3em}
.qb li{margin:7px 0;font-size:16.5px;line-height:1.85;color:var(--ink2)}
.qb li b,.qb p b{color:var(--ink)}
.qb h4.fq{border:0;padding:14px 0 0;margin-top:24px;border-top:1px dashed var(--line);font-size:18.5px;line-height:1.55}
.qb h4.fq span{display:inline-block;font-size:12.5px;color:#fff;background:var(--c,var(--ink));border-radius:6px;padding:0 7px;margin-right:8px;vertical-align:2px}
.qb h4.fq+p{font-size:17px;color:var(--ink)}
.flowbox{margin:12px 0 14px;padding:12px 16px;border-radius:12px;background:var(--soft);text-align:center;font-size:16px;line-height:1.8}
.flowbox div{margin:2px 0}
.subli{margin:4px 0 2px;padding-left:12px;border-left:2px solid var(--line);font-size:16px;line-height:1.8}
.subli b{color:var(--c,var(--ink))!important}
.qb ol>li{margin-bottom:14px}
.deep{margin:18px 0 6px;border-top:1px dashed var(--line);padding-top:10px}
.deep>summary{cursor:pointer;font-weight:700;font-size:15.5px;color:var(--c,var(--ink));list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--soft)}
.deep>summary::-webkit-details-marker{display:none}
.deep>summary:after{content:"▾"}.deep[open]>summary:after{content:"▴"}
.deep[open]>summary{margin-bottom:6px}
.tbl{margin:10px 0 14px;overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.7}
.tbl th{background:var(--soft);text-align:left;padding:8px 10px;font-size:14px;color:var(--mute);white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.tbl td:first-child{white-space:nowrap;color:var(--ink)}
@media (max-width:640px){.tbl thead{display:none}.tbl table,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 12px}
  .tbl td{border:0;padding:4px 0}.tbl td:first-child{font-size:17px;padding-top:8px}
  .tbl td:not(:first-child):before{content:attr(data-h);display:block;font-size:12.5px;color:var(--mute);font-weight:700}}
.pn{display:flex;justify-content:space-between;gap:10px;margin:26px 0 10px}
.pn button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;font-size:15px;box-shadow:var(--shadow)}
.pn button small{display:block;color:var(--mute);font-size:12.5px}
.pn button.nx{text-align:right}
.hitinfo{color:var(--mute);font-size:14px;margin:0 0 12px}
@media (max-width:980px){
  .qa-wrap{display:block}.side{display:none}.qa-main{max-width:var(--read);margin:0 auto}
  .qi{scroll-margin-top:155px}
  .secbar{display:flex;gap:6px;position:sticky;top:93px;z-index:10;background:var(--bg);padding:8px 0;margin:-8px 0 14px;border-bottom:1px solid var(--line)}
  .secs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
  .secs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:14px;white-space:nowrap}
  .secs button.on{border-color:var(--c);background:var(--c);color:#fff;font-weight:700}
  #tocbtn{flex:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:700}
}
@media (max-width:600px){html,body{font-size:16.5px}main{padding:16px 12px 80px}.qi{padding:14px 14px 6px}.qi h3{font-size:18.5px}.sech{font-size:22px}.secbar{top:89px}.qi{scroll-margin-top:150px}}
.drawer .ol-q,.drawer .ol-sec{font-size:15px}
.sp{border:0;background:none;padding:0;color:var(--ren);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px;line-height:inherit}
.sp.g{color:inherit;text-decoration-color:var(--mute)}
mark.hit{background:color-mix(in srgb,#E8B04B 40%,transparent);color:inherit;border-radius:3px}
/* spots */
.sv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:960px){.sv{grid-template-columns:1fr;max-width:var(--read);margin:0 auto}}
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);position:sticky;top:110px;align-self:start}
@media (max-width:960px){.mapbox{position:static}}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox .cap{font-size:13px;color:var(--mute);padding:4px 4px 0}
.dot{cursor:pointer} .dot text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;font-weight:600}
.dot.dim{opacity:.15}
.efilt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.efilt button{border:1.5px solid var(--c);background:var(--card);color:var(--c);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:700}
.efilt button[aria-pressed=true]{background:var(--c);color:#fff}
.layer{margin-bottom:18px}
.layer h3{font:700 18px var(--serif);margin:0 0 8px;color:var(--c)}
.layer h3 small{font:400 13px var(--sans);color:var(--mute);margin-left:6px}
.sc{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.sc:hover{border-color:var(--ink)}
.sc .d{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none;background:var(--c)}
.sc b{display:block;font-size:16px} .sc small{color:var(--ink2);font-size:14px;display:block;line-height:1.6}
.walk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.walk ol{margin:6px 0 0;padding-left:22px;font-size:15.5px}
.walk small{color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:15px;text-decoration:none;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;background:var(--card);box-shadow:0 -6px 30px rgba(0,0,0,.18);overflow:auto;transition:transform .25s ease;right:0;top:0;bottom:0;width:min(560px,92vw);transform:translateX(105%);padding:20px 24px 44px}
.drawer.on{transform:none}
@media (max-width:640px){.drawer{left:0;right:0;top:auto;width:auto;max-height:85vh;border-radius:16px 16px 0 0;transform:translateY(105%);padding:8px 18px 36px}
  .drawer:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}}
.drawer .x{position:sticky;top:0;float:right;border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:19px;line-height:34px}
.drawer h2{font:700 20px/1.5 var(--serif);margin:4px 44px 8px 0}
.drawer .eyebrow{font-size:13px;font-weight:700;color:var(--c,var(--mute))}
.drawer .sub{font-size:16.5px;line-height:1.8;margin:0 0 6px;padding-bottom:12px;border-bottom:1px solid var(--line);color:var(--ink2)}
.drawer .qb{display:block;padding:0;margin:0;border:0}
.drawer .more{margin-top:18px;font-size:15px}
.drawer .more>b{display:block;margin-bottom:4px;color:var(--mute);font-size:13.5px}
.drawer .more .qc{display:block;margin:5px 0}
.drawer .qc{font-size:14.5px}
footer{max-width:var(--read);margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header>
  <div class="hd"><h1>羅馬藝術觀｜推論脈絡</h1></div>
  <nav role="tablist">
    <button role="tab" data-v="flow" aria-selected="true">脈絡圖</button>
    <button role="tab" data-v="qa" aria-selected="false">問答</button>
    <button role="tab" data-v="spots" aria-selected="false">景點對照</button>
  </nav>
</header>
<main>
  <section class="view on" id="v-flow">
    <h2 class="sech" style="--c:var(--ink);max-width:820px">序｜看懂藝術的三把鑰匙</h2>
    <div class="preqa" id="preqa"></div>
    <div class="nextq"><span class="id">接著問</span><h3>把這三個問題套到羅馬，會是什麼樣子？</h3></div>
    <p class="lead"><span class="wide-only">左到右是時代，上到下是檢索維度；「怎麼變過來」那一列寫的是每個時代如何從上一個時代轉變。</span><span class="narrow-only">由上往下是時代，卡片之間寫的是時代怎麼變過來。</span>點地名看地圖，點題號看問答。</p>
    <div class="mx" id="mx"></div>
    <div class="stk" id="stk"></div>
  </section>

  <section class="view" id="v-qa">
    <div class="qa-wrap">
      <aside class="side" id="side">
        <input id="q" type="search" placeholder="搜尋人名、景點、作品">
        <div id="outline"></div>
      </aside>
      <div class="qa-main">
        <div class="secbar" id="secbar"><div class="secs" id="secs"></div><button id="tocbtn">目錄</button></div>
        <div id="pane"></div>
      </div>
    </div>
  </section>

  <section class="view" id="v-spots">
    <p class="lead read">問答裡提到的羅馬地點，依時代分好。點地點可以打開你的羅馬地圖或 Google 地圖。</p>
    <div class="efilt" id="efilt"></div>
    <div class="sv">
      <div class="mapbox"><svg id="mini" viewBox="0 0 600 470"></svg><div class="cap">依實際座標畫的位置示意。■ 是飯店，點圓點看介紹。</div></div>
      <div>
        <div id="layers"></div>
        <h3 class="h2" style="margin-top:22px">羅馬地圖上的大師 City Walk</h3>
        <div id="walks"></div>
        <h3 class="h2" style="margin-top:22px">一次看四位大師的路線（Q10-1）</h3>
        <div class="walk" style="--c:var(--ren)"><small>從競技場旁出發，一路往西北走。</small><ol id="r52"></ol></div>
      </div>
    </div>
  </section>

<script>
const SECS_EMBED = [{"title": "序｜看懂藝術的三把鑰匙", "era": "pre", "qs": [{"id": "Q0", "q": "普通遊客去義大利前，該怎麼建立看懂藝術的基礎？", "s": "不用背畫家生平。在作品前問四個問題：誰出錢？羅馬當時是什麼身分？當時有什麼新思想和技術？藝術家怎麼回應？就能替陌生的作品找到它的時代。", "b": [["li", "**誰出錢、為什麼**：皇帝要展示國力；教會要向不識字的人講聖經；富商要替家族留名；教宗和王室要把信徒拉回教會、展現權威。"], ["li", "**羅馬當時的身分**：帝國首都 → 廢墟與聖城 → 教宗重建的新中心 → 反宗教改革大本營 → 統一後的首都。"], ["li", "**新思想與新技術**：人文主義、透視法、解剖學、油畫與畫布、反宗教改革的教義。"], ["li", "**藝術家怎麼回應**：同樣的條件，米開朗基羅和拉斐爾做出完全不同的作品；卡拉瓦喬的畫還曾被教會退件。"], ["li", "**結果就是時代風格**："], ["sub", "**中世紀**：平面、金色背景、表情嚴肅。"], ["sub", "**文藝復興**：立體空間、真實人體、構圖穩定。"], ["sub", "**巴洛克**：斜線動態、強烈明暗、情緒激烈。"], ["deep", ""], ["h", "為什麼從「誰出錢」看起"], ["p", "在義大利，大部分重要作品都是訂做的。古羅馬皇帝蓋萬神殿和凱旋門，是為了展示國力；中世紀教會用壁畫和馬賽克講聖經，因為多數人不識字；文藝復興的銀行家請人作畫，是為了提升家族地位，有時還把自己畫進聖經故事裡（稱為「供養人」）；巴洛克時期，教會為了對抗新教、把信徒拉回教堂，大量訂製華麗、有戲劇性的作品。"], ["h", "同一個時代，不同城市長得不一樣"], ["p", "城市的地理和誰在掌權，也會影響風格："], ["tbl", [["時代", "城市對照", "地理與政經背景", "藝術風格與觀察重點"], ["**古羅馬**", "**羅馬城** vs. **龐貝**", "帝國首都（需要政治威權）vs. 富豪渡假勝地（私人享樂）", "羅馬留下一眼震撼的巨型公共建築（競技場、萬神殿）；龐貝則是生活化的宅邸壁畫（龐貝紅）與馬賽克。"], ["**中世紀**", "**拉文納** vs. **西耶納/盧卡**", "東羅馬帝國海港橋頭堡 vs. 獨立自治的托斯卡納商業山城", "拉文納受君士坦丁堡影響，教堂內部貼滿莊嚴的**拜占庭金箔馬賽克**；托斯卡納山城則融合北方哥德線條，人物多了一絲人間柔美與敘事感。"], ["**文藝復興**", "**佛羅倫斯** vs. **威尼斯**", "內陸銀行家共和國 vs. 氣候潮濕的海上貿易帝國", "佛羅倫斯講究理性、幾何透視與精準素描（達文西、米開朗基羅）；威尼斯因潮濕改用油畫布，受東方貿易影響，極度重視**濃郁色彩與氣氛**（提香）。"], ["**巴洛克**", "**羅馬** vs. **拿坡里** vs. **杜林**", "教廷大本營 vs. 西班牙總督統治的混亂港都 vs. 薩伏依王室首都", "羅馬追求歌劇般的榮光與舞台感（貝尼尼）；拿坡里充滿底層掙扎，畫風極度**暗黑寫實**；靠近法國的杜林則展現幾何秩序與宮廷優雅。"]]], ["h", "技術讓什麼變成可能"], ["p", "15 世紀初佛羅倫斯發展出數學透視法，畫面才有了真實的遠近；藝術家研究解剖，人體才畫得準確；油畫和畫布在威尼斯普及後，色彩和光影變得更豐富。"], ["h", "為什麼最後還是要看藝術家"], ["p", "時代條件決定了題材和預算，畫成什麼樣子還是要看藝術家。米開朗基羅和拉斐爾同時替同一位教宗工作，一個充滿力量，一個和諧優雅。三傑把「完美」做到頂之後，後輩只能另找出路，才有了矯飾主義和巴洛克。"], ["h", "在現場可以倒過來用"], ["p", "先看畫面認出時代，再回頭想：是誰出錢？為什麼要這樣做？"]]}, {"id": "Q0-1", "q": "一般人不都是從畫家和派別開始認識藝術嗎？", "s": "那條路沒有錯，但在現場不夠用：大部分作品的作者你沒聽過，同一位大師的風格也會變。先用時代條件定位，再認識畫家，兩者互補。", "b": [["li", "**大部分作品的作者你沒聽過**：教堂和美術館裡，除了少數大師，多數是不知名畫家或工作室的作品。"], ["li", "**大師也會改變風格**：米開朗基羅年輕時的《大衛》冷靜理想，晚年的《最後的審判》激動扭曲。"], ["li", "**派別是後人貼的標籤**：藝術家作畫時想的是金主的要求，不是「我要畫一幅巴洛克」。"], ["li", "**兩者互補**：時代條件幫你判斷作品的年代和用途；認識畫家，才看得出他跟同時代的人哪裡不一樣。"], ["deep", ""], ["h", "傳統為什麼從畫家教起"], ["p", "從 16 世紀瓦薩里的《藝苑名人傳》開始，藝術史就常以畫家傳記和派別來整理，好記、故事也好聽。"], ["h", "畫家的價值在哪裡"], ["p", "卡拉瓦喬和貝尼尼都在回應教廷「打動信徒」的需求，但他們做出來的東西超出金主的想像：卡拉瓦喬找街上的普通人當聖人的模特兒，有些畫甚至因為太大膽而被退件。"]]}, {"id": "Q0-2", "q": "那出發前，我該怎麼準備？", "s": "先熟悉看作品的四個問題，再挑 3～5 位跟行程有關的大師深入認識。", "b": [["ol", "**熟悉四個問題**：誰出錢、羅馬當時的身分、新思想與技術、藝術家怎麼回應。"], ["ol", "**挑 3～5 位大師**：照行程挑。例如羅馬看米開朗基羅、拉斐爾、貝尼尼、卡拉瓦喬；佛羅倫斯看波提切利；威尼斯看提香。"]]}]}, {"title": "前言", "era": "intro", "qs": [], "intro": ["看懂藝術不必先背畫家和派別。", "只要問三個問題：誰出錢、在哪裡、時代想要什麼。", "出錢的人有什麼需求，就決定了時代的審美；", "審美決定了哪一種藝術家會被重用；最後才是作品。", "先用「誰出錢、在哪裡、時代想要什麼」幫作品找到它的時代，再認識畫家和派別，就不會變成死背。"]}, {"title": "一、羅馬是一座什麼樣的城市", "era": "", "qs": [{"id": "Q1", "q": "我該用什麼樣的角度來看待「羅馬」？", "s": "看待羅馬最直白的角度，就是理解它同時擁有西方歷史上最強大的「兩個首都身分」：先是**古羅馬帝國的政治首都**，後來又變成**天主教廷的宗教首都**。因為兩千多年來權力中心一直在這裡延續，後代統治者沒有把前朝建築全拆光，而是直接在古羅馬的遺址上「改建、借用、疊加」新建築。所以在羅馬逛街，你看到的不是單一時代的古蹟，而是「帝國遺跡」與「教宗藝術」混搭在一起的現場。", "b": [["p", "很多人去羅馬會覺得眼花撩亂，是因為其他義大利城市通常只代表一個黃金時代（例如佛羅倫斯主打文藝復興、龐貝主打古羅馬），但羅馬卻把兩千年的歷史全部塞在同一座城市裡。"], ["p", "要看懂羅馬，出發前只要抓準以下**三個事實**："], ["h", "1. 羅馬先後當過「兩個世界中心」（決定了城市裡有哪兩種東西）"], ["p", "羅馬之所以跟別的城市不一樣，是因為它先後掌握過西方最強大的世俗權力與宗教權力："], ["li", "**第一階段：古羅馬帝國的首都（世俗與政治威權）：** 作為橫跨歐亞非的帝國心臟，羅馬皇帝需要向全城百姓與外國使節展示無可匹敵的國力。因此留下了巨大、務實、氣派的公共建築——競技場、凱旋門、神殿與大型公共浴場。"], ["li", "**第二階段：天主教廷的首都（宗教與感官震撼）：** 基督教成為國教並定都羅馬後，教宗接管了這座城市。到了文藝復興與巴洛克時期，教廷砸下整個天主教世界的財富，聘請頂尖大師在羅馬蓋起最華麗的教堂、廣場與噴泉，用來展現天主教的榮光。"], ["h", "2. 後代沒有把舊建築拆光，而是「直接改建與借用」"], ["p", "西羅馬帝國滅亡後，羅馬並沒有變成無人荒城，新上任的教宗與貴族就地取材，直接在古羅馬的建築基礎上繼續生活與建設，形成了三種常見的混合景象："], ["li", "**把神殿直接改成教堂（建築機能轉換）：** 最經典的例子是**萬神殿（Pantheon）**——它原本是古羅馬皇帝獻給眾神的異教神殿，中世紀時教會直接把它改造成天主教教堂，正因如此它才沒有被拆毀，完整保存到今天。"], ["li", "**拆古羅馬的石柱來蓋新教堂（建材回收）：** 中世紀與文藝復興時期，教宗經常把荒廢的古羅馬神殿與競技場當成現成的「採石場」。你在羅馬早期教堂裡看到的整排大理石柱，常常粗細、花紋都不太一樣，因為它們原本是從不同的古羅馬神殿拆過來的。"], ["li", "**沿著古羅馬廢墟地基蓋新廣場（空間形狀延續）：** 例如納沃納廣場（Piazza Navona）那獨特的狹長橢圓形，並不是建築師憑空設計的，而是因為周圍的房子直接蓋在古羅馬「戰車競技場」的觀眾席地基上，中間的賽道就變成了今天的廣場。"], ["h", "3. 後代統治者都在向「古羅馬」看齊與較勁"], ["p", "看懂羅馬的最後一個重點，是明白後代掌權者為什麼都要在這裡大興土木——因為在西方歷史上，「佔領並美化羅馬」就等於宣告自己是正統繼承人："], ["li", "**文藝復興的教宗（15–16 世紀）：** 把米開朗基羅、拉斐爾請到羅馬，目的是要蓋出能與古羅馬帝國並駕齊驅的偉大建築（例如重建聖彼得大教堂）。"], ["li", "**巴洛克的教宗（17–18 世紀）：** 面對宗教改革危機，貝尼尼與波羅米尼等大師用極度戲劇化的雕塑、噴泉與教堂立面，把羅馬打造成一座震撼人心的宗教舞台。"], ["li", "**近代與現代統治者（19–20 世紀）：** 義大利統一後蓋了巨大的白色大理石紀念碑「維托里亞諾（祖國祭壇）」，後來的墨索里尼更開闢帝國大道，全都是為了向世界宣告：「我們繼承了古羅馬帝國的輝煌。」"]]}, {"id": "Q1-1", "q": "羅馬疊了這麼多時代，為什麼導覽通常只講古羅馬、文藝復興、巴洛克？", "s": "因為這三個時代，剛好是羅馬在兩千年歷史中**「最有錢、權力最集中、且原創藝術突破最高」**的三次巔峰；而夾在中間的**中世紀**與後來的**近現代**，羅馬正好處於衰敗或失去歐洲主導權的低潮期，沒錢蓋大建築，自然留不下太多震撼遊客的代表作。", "b": [["p", "這並不是導覽員偏心，而是直接反映了羅馬的「錢包厚度」與「國際地位」變化。只要看懂另外兩個時代的羅馬發生了什麼事，就能明白為什麼導覽重心都集中在這三段時期："], ["h", "1. 為什麼跳過「中世紀」（4–14 世紀）？—— 因為當時的羅馬又窮又荒涼"], ["li", "**人口暴跌、城市變成廢墟：** 西羅馬帝國滅亡後，羅馬失去帝國稅收，又經歷蠻族洗劫與戰亂，人口從巔峰時期的 100 多萬暴跌到只剩 2、3 萬人。曾經輝煌的古羅馬廣場荒廢到長滿野草，當地人甚至直接把它叫做「牛場（Campo Vaccino）」。"], ["li", "**教宗搬去法國（亞維農之囚）：** 14 世紀時，教廷受制於法國王室，教宗甚至搬到法國亞維農住了將近 70 年（1309–1377），羅馬徹底失去政治與宗教中心的地位。"], ["li", "**藝術表現受限：** 沒有大金主，就請不起頂尖藝術家，也蓋不起宏偉的新建築。中世紀羅馬的教堂（如拉特朗聖若望大殿、越台伯河聖母大殿）大多只能拆古羅馬神殿的舊石柱拼湊建造，頂多在祭壇半圓頂貼上拜占庭風格的金色馬賽克。同時期真正代表中世紀藝術巔峰的哥德式大教堂，是蓋在有錢的法國（如巴黎聖母院），而不是窮困的羅馬。"], ["h", "2. 為什麼少講「巴洛克之後」（18–20 世紀）？—— 因為藝術中心搬去巴黎了"], ["li", "**歐洲主角換人當：** 18 世紀以後，隨著工業革命、啟蒙運動與法國大革命，歐洲的財富與文化創新中心從義大利轉移到了**法國巴黎**與**英國倫敦**。我們熟知的新古典主義、浪漫主義、印象派到現代藝術，主戰場幾乎都在巴黎。"], ["li", "**羅馬變成「臨摹教室」而非「發源地」：** 此時的羅馬不再引領新潮流，而是變成各國年輕藝術家來學習古羅馬與文藝復興遺產的「朝聖地」（例如法國設立羅馬大獎，送畫家來羅馬進修）。"], ["li", "**近現代建築偏向「復古模仿」：** 1870 年義大利統一、定都羅馬後，為了展現新國家的氣勢，蓋了巨大的白色大理石紀念碑「維托里亞諾（祖國祭壇）」；20 世紀墨索里尼執政時，也蓋了方正嚴肅的 EUR 區。但這些建築本質上都是在**模仿古羅馬的排場**，在藝術史上缺乏開創性，一般遊客也很少為了看現代建築專程飛來羅馬。"], ["h", "3. 反觀「古羅馬、文藝復興、巴洛克」為何不可取代？"], ["p", "這三個時代之所以佔據 90% 的導覽篇幅，是因為它們決定了你今天在羅馬眼睛看到的一切："], ["ol", "**古羅馬（帝國巔峰）：** 掌握全地中海財富，發明混凝土與大型拱頂技術，蓋出了羅馬競技場、萬神殿等奠定西方建築基礎的奇蹟。"], ["ol", "**盛期文藝復興（教廷重返巔峰）：** 15 世紀末教宗重新掌控羅馬並集中全歐洲的教會財富，把佛羅倫斯最頂尖的大師（米開朗基羅、拉斐爾）全部挖角過來，創作出西斯汀小堂、聖彼得大教堂等寫實藝術巔峰。"], ["ol", "**巴洛克（羅馬就是發源地）：** 17 世紀面對宗教改革危機，羅馬教廷砸重金反擊，**巴洛克風格直接誕生在羅馬**。貝尼尼、卡拉瓦喬、波羅米尼都在這裡創作，你今天在羅馬逛到的絕大多數廣場、噴泉（如特雷維噴泉、四河噴泉）與教堂華麗外觀，全都是這個時期定型的。"], ["p", "簡單來說，導覽只講這三個時代，是因為**羅馬在「古羅馬」打下了城市地基，在「文藝復興」蓋出了世界級傑作，並在「巴洛克」完成了整座城市的最終裝修**。"]]}]}, {"title": "二、第一個時代：古羅馬", "era": "anc", "qs": [{"id": "Q2", "q": "古羅馬的藝術特色是什麼？", "s": "古羅馬藝術的核心特色可以用三個詞概括：**「極度務實」、「宏大排場」與「殘酷寫實」**。不同於古希臘人追求哲學與理想美的「為藝術而藝術」，古羅馬人是天生的工程師與政治家——他們把藝術當成「治國與宣傳工具」，發明了混凝土與大型圓拱技術來蓋巨型公共建築，並在雕塑與浮雕上追求一絲不苟的寫實細節，用來記錄戰功與展現統治者的權威。", "b": [["p", "延續前面建立的「贊助者＋地點＋技術 → 風格」邏輯，古羅馬的贊助者是**帝國皇帝與元老院**，地點是**橫跨歐亞非的帝國首都羅馬**，他們對藝術的唯一要求就是：**好用、耐用、而且能讓所有人一眼感受到帝國的強大**。這造就了古羅馬藝術的四大鮮明特色："], ["h", "1. 建築：不靠美學靠工程，用「混凝土＋圓拱」蓋出巨無霸空間"], ["p", "古希臘神殿（如帕德嫩神殿）靠一排排大理石柱撐起屋頂，柱子之間不能離太遠，導致內部空間其實很狹小；但古羅馬人追求的是能容納幾萬人的公共大空間，於是他們在建築技術上做了兩大突破："], ["li", "**發明火山灰混凝土（Roman Concrete）：** 便宜、堅固、可以灌漿塑形，讓羅馬人不必受限於巨石搬運，能快速蓋出超大型建築。"], ["li", "**把「圓拱（Arch）」與「穹頂（Dome）」玩到極致：** 利用圓拱將重量往兩側分散，疊出多層拱門的**羅馬競技場**；把圓拱旋轉一圈，就變成了直徑 43.3 公尺、無需任何柱子支撐的**萬神殿大穹頂**，這個紀錄保持了一千多年無人能破。"], ["h", "2. 雕刻：拒絕美化修圖，追求連皺紋都刻出來的「超寫實主義」"], ["p", "如果你把古希臘雕像和古羅馬雕像放在一起，一眼就能看出差別："], ["li", "**古希臘人愛「理想美」：** 希臘雕塑裡的人無論老少，臉龐都像天神一樣完美無瑕、肌肉勻稱、表情平靜。"], ["li", "**古羅馬人愛「真像本人（Verism）」：** 羅馬貴族流行在家中供奉祖先的死亡面具，因此發展出極度寫實的肖像傳統。古羅馬元老或將軍的雕像，**皺紋、禿頭、雙下巴、鷹勾鼻甚至臉上的痣**都會如實刻出來——在羅馬人眼裡，滿臉皺紋代表經驗老道、為國操勞，這比長得帥更有政治說服力。"], ["li", "**皇帝的「政治宣傳照」：** 到了帝國時期，皇帝雖然會稍微修飾身材（例如穿上威風的盔甲、擺出指點江山的手勢），但五官依然保持高度辨識度，讓帝國邊疆的百姓一看雕像就知道「這就是現任皇帝」。"], ["h", "3. 浮雕與紀念碑：石頭上的「戰地新聞紀錄片」"], ["p", "古羅馬沒有報紙和電視，皇帝打贏勝仗回國，最直接的宣傳方式就是蓋**凱旋門**與**紀功柱**，上面刻滿密密麻麻的連續浮雕："], ["li", "**寫實記錄軍功：** 像**圖拉真紀功柱（Trajan's Column）**，整根柱子像一幅長達 200 公尺的螺旋連環畫，鉅細靡遺刻出羅馬軍團如何搭浮橋、砍樹蓋營地、攻城掠地，連敵軍長什麼樣子、穿什麼衣服都考據得一清二楚，簡直是石頭版的戰地紀錄片。"], ["h", "4. 壁畫與馬賽克：擅長「用假風景放大室內空間」"], ["p", "古羅馬富豪的宅邸（在羅馬帕拉丁山或龐貝古城都能看到）往往採光有限，為了讓房間看起來更氣派，羅馬畫師發展出非常高明的空間錯覺技法："], ["li", "**牆面透視壁畫：** 畫師會在實心牆壁上畫出逼真的「假窗戶、假柱廊與花園風景」，讓狹小的客廳在視覺上瞬間向外延伸。"], ["li", "**實用又華麗的馬賽克地板：** 羅馬人愛用彩色小石子拼貼地板，題材從幾何圖案、神話故事到宴會剩菜殘渣（一種炫耀家裡吃得很好的幽默題材）無所不包，既防水耐磨又展現屋主財力。"]]}, {"id": "Q2-1", "q": "古羅馬在羅馬留下了什麼？有有名的藝術家嗎？", "s": "留下的不只萬神殿和競技場，還有凱旋門、紀念柱、浴場和寫實的肖像雕刻。古羅馬幾乎沒有留下名字的藝術家，因為當時做雕刻和繪畫被當成工匠的工作，作品上刻的是出錢的皇帝。", "b": [["h", "羅馬城裡看得到的"], ["li", "**萬神殿**：約西元 125 年完成，巨大的混凝土圓頂中間沒有任何柱子支撐，頂端開一個圓洞採光。"], ["li", "**羅馬競技場**：西元 80 年完工，可容納約五萬人，是皇帝送給市民的娛樂場。"], ["li", "**君士坦丁凱旋門**：在競技場旁，紀念皇帝打勝仗。"], ["li", "**圖拉真柱**：在圖拉真市集旁，柱身螺旋刻著兩千多個人物，記錄皇帝出征的過程。"], ["li", "**卡拉卡拉浴場**：皇帝蓋給市民的大型公共浴場。"], ["li", "**肖像雕刻**：共和時期到維斯帕先皇帝的肖像，連皺紋都照實雕出來；奧古斯都則刻意把自己雕得年輕完美。"], ["h", "羅馬以外"], ["p", "南義的龐貝和赫庫蘭尼姆被火山灰掩埋，完整保存了貴族住宅裡的彩色壁畫和馬賽克地板。"], ["h", "為什麼沒有有名的藝術家？"], ["p", "在古羅馬，雕刻和繪畫被看成體力活，多由希臘奴隸或獲得自由的工匠來做，作品上記的是皇帝的名字和年份。少數例外是圖拉真皇帝的建築師「大馬士革的阿波羅多洛斯」，他設計了圖拉真廣場和圖拉真柱，名字流傳至今。藝術家要等到文藝復興，才重新成為受人尊敬的名人。"]]}]}, {"title": "三、古羅馬之後：中世紀", "era": "med", "qs": [{"id": "Q3", "q": "西羅馬帝國結束後，羅馬的藝術變成什麼樣子？", "s": "出錢的人從皇帝換成了教會。藝術的任務變成向不識字的信徒講聖經故事，所以不再追求寫實，人物畫得平面、莊嚴，背景常是一片金色。", "b": [["h", "出錢的人換了"], ["p", "西元 313 年基督教合法化，教會開始在羅馬蓋教堂。最早的教堂直接沿用古羅馬公共大廳「巴西利卡」的長方形格局。拉特朗聖若望大殿就是羅馬第一座官方教堂。"], ["h", "為什麼要拆古蹟蓋教堂"], ["p", "帝國衰亡後，羅馬沒有財力開採新石材，教會就把廢棄神殿和浴場的石柱拆來用。所以有些老教堂裡，兩排柱子的粗細、柱頭樣式都不一樣。"], ["h", "金色馬賽克"], ["p", "工匠把貼了金箔的玻璃小方塊，用不同角度嵌在祭壇後方的半圓形牆面上。燭光一照，整面牆會閃閃發亮。人物沒有立體感，表情嚴肅，目的是讓人感受到神聖，而不是像真人。"]]}, {"id": "Q3-1", "q": "為什麼現在逛羅馬，中世紀好像不見了？", "s": "有三個原因：中世紀的羅馬本來就窮，蓋得少；14 世紀教廷搬去法國，羅馬更加荒廢；16、17 世紀教宗有錢以後，又把很多中世紀教堂拆掉重建或重新裝修。", "b": [["h", "羅馬最荒涼的年代"], ["p", "1309 到 1377 年，教廷搬到法國亞維農，羅馬人口大減，古羅馬廣場甚至變成放牛的地方，被叫做「牛市場」。"], ["h", "被後來的時代蓋過去"], ["p", "教宗回到羅馬、財力恢復後，嫌中世紀教堂又暗又舊，有的整座拆掉重建（例如聖彼得大教堂，16 世紀拆掉舊教堂重蓋），有的換上巴洛克風格的外觀和裝飾。所以常會遇到外觀是 17 世紀巴洛克，走進去祭壇上方卻是中世紀馬賽克的教堂。"]]}, {"id": "Q3-2", "q": "所以現在在羅馬，能看到中世紀留下來的作品多嗎？", "s": "整體數量確實遠不如古羅馬與巴洛克，但並沒有完全消失——它們大多不是整棟獨立的建築，而是「隱藏在巴洛克教堂內部」的局部遺產。在羅馬看中世紀，重點不是找「純中世紀建築」，而是走進老教堂裡，尋找躲過後代翻修的金色馬賽克、碎石拼花地板與地下墓室。", "b": [["h", "躲在巴洛克外殼裡的中世紀"], ["p", "因為 17 世紀的教宗流行替老教堂「換新衣」，羅馬許多中世紀教堂在外觀上已經完全看不出來了。你必須推開華麗的巴洛克大門走進去，才會發現主祭壇上方的半圓頂、或側面小禮拜堂裡，還完整保留著 5 到 13 世紀的金色馬賽克（例如聖母大殿、越台伯河聖母大殿）。"], ["h", "低頭看腳下的「科斯馬蒂地板」"], ["p", "除了抬頭看祭壇馬賽克，羅馬老教堂最常保留下來的中世紀真跡其實在腳底下。12 到 13 世紀羅馬當地的科斯馬蒂（Cosmati）工匠家族，擅長把古羅馬遺址撿來的彩色大理石與斑岩切成幾何碎片，拼出極度繁複華麗的馬賽克地板，幾乎走進任何一座羅馬古老教堂都能踩得到。"], ["h", "想看「純中世紀」要去哪裡？"], ["p", "如果在羅馬市區看不過癮，想看整座城市都停留在中世紀的樣子，必須離開羅馬往外走：例如距離羅馬約一兩小時車程的托斯卡納山城（如西耶納、盧卡、聖吉米尼亞諾），或東北部受拜占庭直接統治的拉文納（Ravenna）——因為這些城市後來沒有經歷羅馬那樣大規模的巴洛克翻修，中世紀的城牆、高塔與滿牆金光馬賽克才得以完整保存下來。"]]}, {"id": "Q3-2-1", "q": "那具體可以去哪幾座教堂看？", "s": "越台伯河聖母大殿最完整：有拆古蹟來用、樣式不一的石柱，也有 12 世紀的金色馬賽克。聖母大殿則有 5 世紀和 13 世紀的馬賽克。", "b": [["li", "**越台伯河聖母大殿**：兩排石柱是從古羅馬建築拆來的，柱頭樣式不一；祭壇上方是 12 世紀的金色馬賽克。"], ["li", "**聖母大殿**：中殿和凱旋拱上的馬賽克是 5 世紀的，祭壇後方的是 13 世紀的。外觀已改成 18 世紀的樣子。"], ["li", "**拉特朗聖若望大殿**：羅馬第一座官方教堂，不過現在的內部是 17 世紀波羅米尼改建的。"], ["li", "**聖巴西德聖殿**：在聖母大殿旁的小教堂，有 9 世紀的金色馬賽克。"]]}, {"id": "Q3-3", "q": "為什麼你說的都是建築，畫呢？", "s": "中世紀羅馬之所以幾乎不談「畫」，是因為當時還沒有發明我們今天熟悉的「畫布油畫」，中世紀的「畫」就是濕壁畫、馬賽克和木板聖像畫——而羅馬潮濕多雨的氣候讓中世紀濕壁畫幾乎全數剝落毀損，木板畫又在後代改建中大量遺失或被替換，只有用玻璃與石頭拼貼的馬賽克撐過了一千年，成為今天唯一能看到的中世紀平面圖像。", "b": [["p", "這是一個非常關鍵的技術與保存問題。"], ["h", "中世紀還沒有「畫布」，畫是直接畫在牆上的"], ["p", "今天我們走進美術館看到的「框起來的畫」，大多是 15 世紀以後才普及的畫布油畫。在長達一千年的中世紀裡，幾乎不存在獨立移動的畫作，當時的繪畫主要只有三種形式：畫在教堂灰泥牆上的「濕壁畫」、用玻璃小塊拼貼的「馬賽克」，以及供奉在祭壇上的「木板蛋彩畫」。"], ["h", "濕壁畫怕潮濕、木板畫怕改朝換代，通通留不下來"], ["p", "羅馬中世紀的畫作之所以在現場幾乎看不見，是因為這三種媒材有兩種極難保存："], ["li", "**濕壁畫（Fresco）受不了潮濕與重畫：** 羅馬冬季多雨潮濕，中世紀教堂屋頂一旦漏水，畫在灰泥牆上的壁畫就會發黴剝落；加上 16、17 世紀教宗翻修教堂時，常直接把舊牆壁刮掉重抹灰泥、覆蓋上新的巴洛克壁畫，導致中世紀壁畫幾乎全軍覆沒（只有極少數像聖克萊門特聖殿的地下層因為被掩埋在土裡，反而意外保留了 11 世紀的壁畫）。"], ["li", "**木板聖像畫（Icon）被新風格取代：** 中世紀教堂祭壇原本擺放許多金色背景的木板聖母像，但到了文藝復興與巴洛克時期，教會嫌這些「紙片人」太過時，紛紛撤下來換成拉斐爾或卡拉瓦喬的新潮祭壇畫，舊木板畫大多損毀或只剩零星幾幅（例如聖母大殿保存的《羅馬人民的救星》聖像畫）。"], ["h", "為什麼只有「馬賽克」活了下來？"], ["p", "在所有平面圖像裡，只有馬賽克（Mosaic）是不怕潮濕、不會褪色、也沒有紙張或木頭會腐爛的。工匠把夾了金箔的彩色玻璃小塊嵌進牆裡，一千年過去依然閃閃發亮——所以這也是為什麼在羅馬講到中世紀的「平面圖像」，大家永遠只會提到馬賽克，因為它就是中世紀留下來的「石頭版繪畫」。"]]}, {"id": "Q3-3-1", "q": "畫布是什麼時候發明的？是因為它才開啟文藝復興嗎？", "s": "畫布大約在 15 世紀末於威尼斯普及（因為當地潮濕、又盛產船帆亞麻布），但它不是文藝復興的原因——文藝復興在 15 世紀初就靠透視法與人文觀念在佛羅倫斯展開了（當時畫在木板與牆壁上）。畫布的真正貢獻是讓畫作從此能「捲起來搬運與買賣」，把文藝復興推進色彩更濃郁的盛期階段。", "b": [["p", "但文藝復興不是因為畫布發明而開始的，時間點也不同。"], ["li", "**文藝復興的起點靠的是「觀念」與「透視法」，不是畫布：** 15 世紀初文藝復興在佛羅倫斯爆發時，畫布還沒流行。達文西的《最後的晚餐》畫在修道院牆壁上（濕壁畫），《蒙娜麗莎》和波提切利的《春》都是畫在厚木板上的。"], ["li", "**畫布與油畫是「文藝復興後半段」的技術升級：** 15 世紀中期，法蘭德斯（今比利時一帶）的畫家改良了油畫顏料，傳入義大利後與威尼斯的亞麻畫布一拍即合。油畫乾燥慢、可以層層疊加出半透明光澤，畫布又有彈性、不反光，這才把文藝復興帶進了色彩更濃郁、光影更細膩的盛期階段。"]]}, {"id": "Q3-3-2", "q": "畫布普及帶來的影響是什麼？", "s": "畫布普及帶來真正革命：畫作終於可以「搬家與買賣」了。", "b": [["p", "雖然畫布沒有催生文藝復興，但它解決了一個存在幾千年的物理難題——在畫布出現之前，畫是「黏在建築物上」或「笨重難搬」的。一旦有了畫布："], ["li", "畫家可以畫出幾公尺寬的超巨幅作品，畫完拆下來捲成一筒，就能跨海賣給西班牙國王或羅馬教宗，不會像厚木板那樣在運輸途中裂開或重到搬不動。"], ["li", "繪畫從此脫離了教堂牆壁的束縛，變成有錢人可以私人收藏、隨時掛在客廳或轉賣的商品，這也是為什麼你在羅馬博爾蓋賽美術館或梵蒂岡博物館看到的 16、17 世紀名畫，幾乎全都是畫布油畫。"]]}]}, {"title": "四、從中世紀到文藝復興", "era": "ren", "qs": [{"id": "Q4", "q": "那文藝復興是怎麼開始的？", "s": "文藝復興不是因為某項畫具發明而突然開始的，而是 14、15 世紀時，佛羅倫斯的銀行家與商人靠貿易發了大財，他們不滿足於中世紀教會「只看重來世、否定現世」的觀念，於是出錢重讀古希臘羅馬典籍、挖掘古代雕塑，並贊助藝術家用數學透視法與人體解剖把「真實的人類與世界」重新畫回藝術裡，這場「以人為本」的思想與藝術復興運動隨後傳到羅馬，開啟了西方藝術的黃金時代。", "b": [["h", "文藝復興的起點不在羅馬，而是在有錢的「佛羅倫斯」"], ["p", "14 世紀末到 15 世紀初，羅馬剛結束教廷搬去法國的荒涼期，城市還沒恢復元氣；反觀北邊的佛羅倫斯靠著紡織業與國際銀行業（例如梅第奇家族）成為全歐洲最有錢的商業共和國。這群務實的商人每天算帳、航海、跟各國做生意，他們開始重視「現世生活」與「人的能力」，決定自己出錢當大金主，贊助藝術與學術。"], ["h", "向「古希臘羅馬」借靈感（文藝「復興」的真正意思）"], ["p", "所謂「文藝復興（Renaissance）」，字面意思就是「重生」，也就是讓失落了一千年的古希臘羅馬文化重新復活。當時義大利學者重新翻譯了古希臘哲學與科學著作，工匠也從土裡挖出古羅馬時期寫實的大理石雕像（例如《拉奧孔》）。藝術家看到這些作品才驚覺：原來一千年前的人類已經能把肌肉、比例和情感刻得這麼逼真！於是大家決定告別中世紀那種扁平的「紙片人」，重新把人畫得像真實有血有肉的個體。"], ["h", "用「數學透視法」把世界變立體"], ["p", "光有想法還不夠，佛羅倫斯藝術家把商人的「數學測量精神」帶進畫室。15 世紀初，建築師布魯內列斯基（Brunelleschi）發明了「單點線性透視法」，畫家只要在畫面上定出一個消失點，就能用幾何線條精準算出建築物的遠近大小；同時畫家也開始偷偷研究人體解剖，搞清楚皮膚底下的骨骼與肌肉怎麼運作。這兩大技術突破，讓繪畫正式從平面的宗教符號，變成彷彿「透過一扇窗戶看出去的真實三度空間」。"], ["h", "教宗重返羅馬，把藝術中心帶到羅馬"], ["p", "文藝復興在佛羅倫斯成熟後，15 世紀末到 16 世紀初，重返羅馬的教宗（如儒略二世）為了重振教廷威權、重建聖彼得大教堂，直接砸重金把佛羅倫斯最頂尖的大師（如米開朗基羅、拉斐爾）全部挖角到羅馬。這才讓羅馬接棒成為「盛期文藝復興」的舞台，留下了西斯汀小堂與梵蒂岡博物館裡的世界級傑作。"]]}, {"id": "Q4-1", "q": "和中世紀相比，文藝復興的畫面差在哪裡？", "s": "一眼看過去最直覺的差別，就是從「扁平、嚴肅、像貼在金色牆上的神聖符號」，變成了「有立體空間、有光影重量、長得像真實人類的戲劇場景」。中世紀畫的是教會想讓你敬畏的「天國概念」，而文藝復興畫家則透過透視法與解剖學，把聖經故事拉回了有建築、有風景、有血有肉的真實人間。", "b": [["p", "以下是三個最容易在現場觀察的畫面維度，一眼就能分出高下："], ["h", "空間感：從「金色平牆」變成「立體房間與風景」"], ["p", "中世紀畫作的背景幾乎都是一片閃亮的金箔或單一色塊，沒有天地線，人物彷彿飄浮在半空中；到了文藝復興，畫家運用「單點透視法」，在畫裡蓋出了精準向遠方延伸的柱廊、磁磚地板與山水風景，整幅畫就像在牆壁上開了一扇窗，讓人一眼望進深邃的三度空間。"], ["h", "人物身體：從「沒有重量的紙片人」變成「有骨有肉的真人」"], ["p", "中世紀因為神學避諱肉體，人物被畫得扁平瘦長、比例失真（連聖嬰耶穌都像縮小版大人），衣服底下完全看不出身體結構；文藝復興畫家透過解剖學與光影明暗，畫出了皮膚底下的骨骼、肌肉起伏與站立時的重心轉移，人物的腳底有了影子、衣褶有了垂墜重量，真正「站穩」在地面上。"], ["h", "表情與構圖：從「呆板排排站」變成「自然互動的金字塔」"], ["p", "中世紀人物多半正面對著觀眾、表情嚴肅冰冷，大家像拍大合照一樣排排站，重要人物就畫得特別大隻；文藝復興則取消了「大人物畫大隻」的規矩，改用穩重和諧的「金字塔形構圖」，畫中人物會彼此眼神交會、低頭微笑或交談，流露出真實而克制的人類情感。"]]}, {"id": "Q4-2", "q": "文藝復興的作品有什麼特點？", "s": "文藝復興作品最核心的特點是「科學寫實」與「理性平衡」。畫家運用數學透視法打造真實的三度空間，並透過人體解剖讓人物擁有精準的肌肉與自然重心；同時在構圖上追求「金字塔式的穩定對稱」，人物表情優雅克制、充滿人文溫度——即使是聖經裡的神明與聖人，看起來也像是比例完美、有血有肉的真實人類。", "b": [["p", "看文藝復興作品時，最明顯的三個技術與審美特點："], ["h", "數學精算出的「立體空間」（單點透視法）"], ["p", "文藝復興藝術家把繪畫當成一門科學，他們在畫面上定出一個「消失點」，讓建築柱廊、地板磁磚與遠方風景都按照精準的幾何比例向深處縮小（例如拉斐爾的《雅典學院》）。觀眾站在畫前，會覺得這不是一塊平面牆壁，而是一扇真正通往立體大廳的窗戶。"], ["h", "有骨有肉的「人體美學」（解剖學與對立式平衡）"], ["p", "畫家透過大體解剖徹底摸清了骨骼與肌肉的運作，不再把人畫成衣服底下的扁平紙片。人物站立時會自然呈現一腳受力、一腳放鬆的「S形重心偏移（Contrapposto）」，肌肉線條充滿力量感（例如米開朗基羅在西斯汀小堂畫的《創世紀》裸體群像），連衣褶都順著身體曲線自然垂墜。"], ["h", "冷靜優雅的「黃金秩序」（金字塔構圖與克制表情）"], ["p", "不同於後來巴洛克的狂風暴雨，盛期文藝復興追求的是「理性、和諧與永恆的穩定感」。畫家最愛使用上尖下寬的「金字塔形構圖」來安排人物，畫面左右對稱平衡；畫中人物即使處在戲劇事件中，表情依然保持優雅、內斂與尊嚴，展現出文藝復興「人文主義」所崇尚的理想人類典範。"]]}, {"id": "Q4-3", "q": "透視、真人表情這些，現在的畫都有，為什麼文藝復興還這麼重要？", "s": "因為今天我們覺得「理所當然」的寫實技巧：包括透視法、人體解剖、光影立體感，甚至畫家作為獨立創作者的社會地位，這些全都是文藝復興從零摸索並定下標準的。\n在此之前，西方藝術失傳了這些技術長達一千年；文藝復興不僅建立了一套沿用至今的視覺語法，更把藝術家從「聽命行事的無名工匠」提升為「擁有個人思想與簽名的大師」，徹底定義了現代意義上的「藝術」。", "b": [["p", "為什麼這些「現在看起來很基本」的東西，在歷史上具有無可取代的地位："], ["h", "他們是「從零發明規則」的人，後代只是沿用"], ["p", "今天任何一個美術系學生第一年就會學的「單點透視法」、「明暗漸層（暈塗法）」和「人體比例公式」，在 14 世紀以前是完全不存在的。文藝復興大師沒有教科書可以抄，達文西必須親手解剖幾十具大體、布魯內列斯基必須用鏡子和幾何學反覆實驗，才把三度空間壓縮進二維畫布的數學公式算出來。沒有他們建立這套「看世界的標準規則」，就沒有後來的巴洛克、學院派，甚至現代電影攝影與 3D 繪圖的視覺邏輯。"], ["h", "「真實的人」走進畫作，開啟了個人自我意識"], ["p", "中世紀畫作裡只有神明與聖徒，普通活人沒有資格出現在聖殿裡；但到了文藝復興，隨著富商與教宗的自我意識高漲，「真實的現代人」開始走進畫布。出資的金主會要求畫家把自己畫進聖經故事角落（稱為「供養人」），同時像《蒙娜麗莎》這樣純粹記錄凡人容貌與個性的「獨立肖像畫」也正式誕生：這代表西方文化正式從「只關注死後靈魂與神明」，轉向肯定「現世的個人價值」。"], ["h", "藝術家從「無名工匠」變成「獨立創作者」"], ["p", "在中世紀，畫畫和雕刻被視為和木匠、石匠一樣的體力勞動，作品很少簽名；但文藝復興大師因為掌握了數學、解剖與文學知識，成功讓社會承認「繪畫是一門高尚的腦力創作」。米開朗基羅敢跟教宗拍桌子爭執創作理念、拉斐爾受到王公貴族平起平坐的禮遇——正是文藝復興確立了「藝術家擁有個人風格與創作自主權」的現代觀念，這才讓後世有了「大師」的概念。"]]}, {"id": "Q4-4", "q": "藝術家怎麼把人體畫得這麼真實？", "s": "有些藝術家親自解剖屍體研究人體，最有名的是達文西和米開朗基羅。", "b": [["h", "達文西"], ["p", "他自己記錄解剖過約 30 具遺體，留下數百頁解剖手稿，畫了骨骼、肌肉、心臟和子宮裡的胎兒。他的研究有些遠遠超前當時："], ["li", "他比較了百歲老人和孩童的血管，記錄下血管壁變厚、阻塞的現象，是最早描述動脈硬化的人之一。"], ["li", "他用玻璃做心臟模型，觀察血流在主動脈瓣附近形成的漩渦，這個發現到 20 世紀後半才被現代醫學證實。"], ["li", "他把人體一層一層剝開、從不同角度畫同一個器官，這種畫法到今天還用在解剖圖譜上。"], ["h", "米開朗基羅"], ["p", "十幾歲時獲得佛羅倫斯聖靈修道院院長的允許，用醫院裡等待下葬的遺體研究解剖。他特別注意肌肉在用力時的變化，這成為他日後《大衛》、《摩西》和西斯汀天頂畫裡那些充滿力量的身體的基礎。"]]}]}, {"title": "五、文藝復興在羅馬", "era": "ren", "qs": [{"id": "Q5", "q": "文藝復興在羅馬發生什麼事？", "s": "文藝復興雖然發源於佛羅倫斯，但它在羅馬達到了最宏偉的巔峰（史稱「盛期文藝復興」）。15 世紀末到 16 世紀初，重返羅馬的教宗（特別是儒略二世）為了重建教廷威權，將整個天主教世界的財富集中到羅馬，直接把佛羅倫斯最頂尖的大師（如米開朗基羅、拉斐爾、布拉曼帖）全部挖角過來，把破敗的中世紀老城改造成一座能與古羅馬帝國比肩的「基督教新首都」。", "b": [["h", "重返羅馬的教宗，把「佛羅倫斯全明星隊」挖角過來"], ["p", "14 世紀教廷搬去法國亞維農期間，羅馬荒廢了將近七十年；等到教宗重新回到羅馬並穩定政局後（15 世紀末），他們面對的是一座殘破不堪、遍地廢墟的城市。為了向全歐洲宣告教廷依然是世界中心，教宗（尤其是野心勃勃的儒略二世 Julius II）決定砸重金進行大規模都市更新。因為當時羅馬本地缺乏頂尖藝術家，教宗直接發揮鈔能力，把已經在佛羅倫斯練就一身本領的米開朗基羅、拉斐爾、建築師布拉曼帖全部請到羅馬，讓羅馬瞬間取代佛羅倫斯，成為全歐洲的藝術最高殿堂。"], ["h", "拆掉千年老教堂，蓋出「比古羅馬更宏偉」的新地標"], ["p", "在佛羅倫斯，文藝復興多半是富商家族出錢蓋禮拜堂或私人宅邸，規模精緻優雅；但到了羅馬，出錢的是擁有全歐洲稅收的教宗，格局瞬間放大成「帝國級的史詩排場」。教宗儒略二世甚至下令拆掉已經有一千多年歷史、但老舊狹小的舊聖彼得大教堂，請布拉曼帖與米開朗基羅重新設計一座擁有巨大穹頂的全新聖彼得大教堂，並重新規劃卡比托利歐山廣場，目的就是要蓋出規模超越萬神殿與羅馬競技場的建築奇蹟。"], ["h", "大師同場較勁，留下梵蒂岡裡的三大巔峰傑作"], ["p", "1508 年前後，幾位巨匠同時在梵蒂岡宮廷裡各自領軍創作，形成藝術史上最傳奇的「同場競技」，直接留下了羅馬文藝復興最核心的三件代表作："], ["li", "**米開朗基羅的《西斯汀小堂天頂畫》（1508–1512）：** 被教宗半強迫接下繪畫任務，獨自一人仰頭畫了四年，將舊約聖經的《創世紀》畫成充滿雕塑般肌肉張力的壯闊史詩（包含著名的《創造亞當》）。"], ["li", "**拉斐爾的《拉斐爾畫室》（1508–1524）：** 就在西斯汀小堂隔壁，年輕的拉斐爾替教宗私人書房繪製壁畫，其中最著名的《雅典學院》將古希臘哲學家（柏拉圖、亞里斯多德）與文藝復興大師（達文西、米開朗基羅、拉斐爾本人）畫在同一個透視大廳裡，完美展現「古典智慧與基督教信仰和諧共存」的盛期文藝復興理想。"], ["li", "**米開朗基羅晚年的《最後的審判》（1536–1541）：** 經過 1527 年「羅馬之劫」（外敵洗劫羅馬）與宗教改革的衝擊，羅馬文藝復興的樂觀氣氛畫下句點。晚年的米開朗基羅重回西斯汀小堂祭壇牆面畫下《最後的審判》，畫面充滿扭曲掙扎的肢體與末日焦慮，也正式預告了下一階段「巴洛克時代」的到來。"]]}, {"id": "Q5-1", "q": "所以我該如何理解羅馬文藝復興的脈絡？", "s": "理解羅馬文藝復興最清晰的方式，就是把它看成一場「由教宗出錢、把佛羅倫斯技術搬來羅馬放大、最後卻因戰亂與宗教危機而走向焦慮轉折」的三階段歷程。羅馬本身不是文藝復興的發源地，它是「總驗收的舞台」——教廷用全歐洲的財富將佛羅倫斯大師請來，把原本精緻的人文寫實放大成帝國級的史詩建築與壁畫，並在短短三十年內走完從「黃金自信」到「末日動盪」的劇烈轉折。", "b": [["p", "只要抓準以下三個時間推進的階段，就能把前面學到的所有零散事件串成一條完整的故事線："], ["h", "第一階段：從佛羅倫斯「借將」到羅馬（15 世紀末–1500 年代）"], ["p", "文藝復興的技術（透視法、解剖學）是在佛羅倫斯成熟的，但當時的羅馬剛結束教廷搬去法國的荒涼期，急需重振門面。於是教宗直接發揮財力優勢，把已經成名的佛羅倫斯全明星隊（米開朗基羅、拉斐爾、建築師布拉曼帖）挖角到羅馬。這意味著羅馬文藝復興一登場就是「巔峰開局」，省去了早期的摸索階段，直接進入最成熟的「盛期文藝復興」。"], ["h", "第二階段：教廷砸重金打造「基督教新帝國」（1503–1520 年代）"], ["p", "到了野心勃勃的教宗儒略二世時期，出資目的從佛羅倫斯富商的「個人與家族榮耀」，升級為天主教廷的「世界中心宣示」。教宗下令拆掉千年老舊的聖彼得大教堂重新蓋大穹頂，同時讓米開朗基羅在西斯汀小堂畫《創世紀》、拉斐爾在教宗書房畫《雅典學院》。這個階段的羅馬作品充滿自信、和諧與史詩般的宏大感，是古典知識與基督教信仰結合得最完美的黃金時刻。"], ["h", "第三階段：1527 年「羅馬之劫」打破黃金夢，轉向巴洛克前夕（1527–1540 年代）"], ["p", "這場黃金盛世並沒有持續太久。1517 年德國爆發宗教改革，緊接著 1527 年神聖羅馬帝國軍隊攻陷並洗劫羅馬（史稱「羅馬之劫」），教宗被困在聖天使堡，城市再次遭到重創。這場災難徹底粉碎了文藝復興對「人類理性與完美世界」的樂觀幻想——最好的證明就是米開朗基羅晚年重回西斯汀小堂畫的《最後的審判》（1536–1541）：畫面不再是《創世紀》那種穩重和諧的黃金比例，而是充滿扭曲、焦慮與審判恐懼的扭動人體，也正式為下一章「巴洛克時代」拉開序幕。"]]}, {"id": "Q5-2", "q": "文藝復興時期教宗砸錢的藝術家，就是米開朗基羅、拉斐爾、建築師布拉曼帖嗎？", "s": "這三位是盛期文藝復興（1500 年代初期）最核心的「教廷三巨頭」，分別掌管雕刻壁畫、宮廷繪畫與聖彼得大教堂建築。但實際上教宗砸錢的清單更長——早在他們之前，教宗就已經重金禮聘過波提切利、佩魯吉諾等佛羅倫斯畫師來畫西斯汀小堂的兩側牆壁；而在他們之後，也有小桑加洛等人接棒，只是這三位的光芒與代表作太過巨大，成了羅馬文藝復興的代名詞。", "b": [["h", "教宗儒略二世時期的「黃金鐵三角」"], ["p", "在羅馬文藝復興最輝煌的 1503 到 1513 年間（教宗儒略二世在位時），教廷確實把絕大部分的核心資源都押在這三位大師身上，三人分工非常明確：布拉曼帖負責設計全新的聖彼得大教堂與梵蒂岡庭院（建築總監）、米開朗基羅負責教宗陵墓雕刻與西斯汀小堂天頂畫、拉斐爾則負責教宗私人書房壁畫。三人幾乎包辦了當時梵蒂岡最頂尖的皇家級工程。"], ["h", "在他們之前，其實還有一批「先鋒部隊」"], ["p", "在 1480 年代（盛期文藝復興正式爆發前），教宗西斯都四世為了裝飾剛蓋好的西斯汀小堂，就已經從佛羅倫斯請來一批一線名家——包括畫《維納斯的誕生》的波提切利（Botticelli）、拉斐爾的老師佩魯吉諾（Perugino），以及米開朗基羅的老師吉蘭達約（Ghirlandaio）。今天你走進西斯汀小堂，除了抬頭看米開朗基羅的天頂畫，左右兩側牆壁上的摩西與耶穌生平壁畫，正是這批「先鋒部隊」的傑作。"], ["h", "為什麼最後大家只記得這三位？"], ["p", "因為波提切利那批畫家在羅馬畫完壁畫後就各自回鄉了，留下的屬於「早期文藝復興」的優雅敘事風格；唯有布拉曼帖、米開朗基羅、拉斐爾真正把古羅馬的宏大氣魄融入作品中，定調了羅馬「盛期文藝復興」的最高標準，因此成為歷史教科書上的三大代表。"]]}, {"id": "Q5-2-1", "q": "為什麼大家都沒聽過建築師布拉曼帖？", "s": "布拉曼帖（Donato Bramante）在建築史上其實是與達文西、米開朗基羅齊名的宗師級人物，一般遊客之所以沒聽過他，主要有三個原因：大眾習慣記「畫家」勝過「建築師」、他設計的聖彼得大教堂後來被米開朗基羅大幅修改並蓋過風頭，以及他本人在工程剛起步不久就過世了，留下的獨立完整作品不多。", "b": [["h", "大眾看藝術史，天生偏愛「畫家與雕塑家」"], ["p", "繪畫（如《蒙娜麗莎》、《創造亞當》）和雕塑（如《大衛》）有明確的故事、人物表情與戲劇張力，最容易印在明信片與教科書上被大眾記住；相比之下，建築講究的是空間比例、結構力學與平面圖配置，一般遊客走進教堂只會驚嘆「好大、好壯觀」，很少會低頭去查建築師是誰——就像大家都很熟達文西，卻很少人記得蓋出佛羅倫斯大教堂圓頂的布魯內列斯基一樣。"], ["h", "聖彼得大教堂的風頭，全被接棒的米開朗基羅搶走了"], ["p", "布拉曼帖一生最偉大的作品，就是受教宗委託設計全新的聖彼得大教堂，他提出了極具古典和諧美感的「希臘十字對稱平面」與巨大中央圓頂構想，奠定了整座教堂的骨架。然而他在 1514 年過世時，教堂才剛打好四根主柱地基；後來接手的米開朗基羅簡化並放大了設計、親自設計了今天最醒目的大圓頂，再後來的貝尼尼又加上了超震撼的廣場柱廊。結果後世遊客提起聖彼得大教堂，只記得米開朗基羅和貝尼尼，反而忘了最初畫出藍圖的布拉曼帖。"], ["h", "在羅馬留下的完整代表作太少"], ["p", "布拉曼帖 55 歲才來到羅馬，15 年後便過世，除了未完成的聖彼得大教堂與梵蒂岡「松果庭院（Cortile della Pigna）」外，他在羅馬最完整、純粹的代表作只有藏在賈尼科洛山丘修道院裡的《坦比哀多禮拜堂（Tempietto）》。這座小圓亭雖然被建築系視為文藝復興最完美的幾何比例教科書，但因為規模小、不在一般觀光客的熱門動線上，導致他在大眾旅遊圈的知名度遠不如其他大師。"]]}, {"id": "Q5-2-2", "q": "達文西不也是文藝復興三傑之一嗎？他在羅馬做了什麼？", "s": "幾乎沒有。他 61 歲到羅馬時，教廷需要的是能快速完成大型壁畫的畫家，而他把時間花在科學研究上，待了三年沒有留下大作，就去了法國。", "b": [["h", "在羅馬的三年（1513–1516）"], ["p", "請他來羅馬的是教宗利奧十世的弟弟朱利亞諾·德·梅第奇，安排他住在梵蒂岡。當時拉斐爾 30 歲，畫得又快又好；米開朗基羅也剛完成西斯汀天頂。達文西卻忙著研究光學、鏡子和解剖。傳記作家瓦薩里記載，教宗曾說他「還沒開始就在想怎麼結束，什麼都完成不了」。"], ["h", "去了法國"], ["p", "1516 年他接受法國國王法蘭索瓦一世的邀請，帶著《蒙娜麗莎》前往法國，三年後在那裡過世。"], ["h", "在羅馬能看到他的什麼"], ["p", "梵蒂岡博物館的畫廊有一幅他未完成的《曠野中的聖葉理諾》。這幅是他早年在佛羅倫斯畫的，19 世紀才進入梵蒂岡收藏，並不是在羅馬畫的。"]]}, {"id": "Q5-2-3", "q": "忍者龜不是以文藝復興大師取名的嗎？為什麼主角有四隻，比三傑多一個？", "s": "多那太羅是文藝復興早期的雕刻家，比達文西早出生約 70 年。《忍者龜》的作者用四位義大利藝術家替烏龜命名，在三傑之外多加了他。", "b": [["p", "他做的青銅《大衛》是古代之後西方第一件獨立站立的裸體雕像（現藏佛羅倫斯巴傑羅美術館）。1984 年《忍者龜》的作者需要四個名字，於是用了李奧納多、米開朗基羅、拉斐爾和多那太羅。"]]}, {"id": "Q5-3", "q": "米開朗基羅在羅馬做了什麼？", "s": "米開朗基羅一生中有超過一半的創作時光都在羅馬度過，他以雕塑家的思維橫跨雕刻、壁畫與建築三大領域，在羅馬留下了定義盛期文藝復興與開啟巴洛克的重量級傑作——包括《聖殤》與《摩西》雕像、西斯汀小堂的《創世紀》天頂畫與《最後的審判》，以及聖彼得大教堂的巨大圓頂與卡比托利歐山廣場，幾乎親手重塑了文藝復興羅馬的天際線與藝術高度。", "b": [["h", "雕刻：從少年成名的《聖殤》到充滿怒氣的《摩西》"], ["p", "米開朗基羅 23 歲初到羅馬時，便雕出了震驚全城的《聖殤（Pietà）》（現藏於聖彼得大教堂），將冰冷大理石雕出絲綢般的柔順與母愛哀傷，也是他一生唯一簽名的作品。中年後，他受教宗儒略二世委託製作陵墓，雕出了肌肉緊繃、眼神充滿威嚴與怒氣的《摩西（Moses）》（現藏於聖伯多祿鎖鏈堂），展現出他最擅長的「壓抑卻即將爆發的力量感」。"], ["h", "壁畫：用雕刻家的肌肉邏輯畫出「西斯汀小堂」"], ["p", "雖然自認是雕塑家而非畫家，米開朗基羅卻在教宗半強迫下獨自完成了西斯汀小堂的兩面巨作：1508 至 1512 年仰頭畫出氣勢磅礴的《創世紀》天頂畫（包含經典的《創造亞當》），把每個人物都畫得像立體雕塑般充滿肌肉張力；二十多年後（1536–1541 年），經歷戰亂與宗教危機的他重返祭壇牆面畫下《最後的審判》，扭曲掙扎的肢體徹底打破文藝復興的平靜，預告了巴洛克時代的來臨。"], ["h", "建築與都市設計：撐起羅馬天際線的「聖彼得大圓頂」"], ["p", "70 歲以後，米開朗基羅將重心轉向建築，接手了布拉曼帖未完成的聖彼得大教堂工程，簡化結構並設計出今天羅馬最醒目的巨大中央圓頂（成為後來全球無數國會與教堂圓頂的原型）。同時，他也重新設計了古羅馬政治中心卡比托利歐山（Campidoglio）的梯形廣場、幾何地面與對稱宮殿立面，為羅馬留下了第一座整體規劃的文藝復興廣場。"]]}, {"id": "Q5-3-1", "q": "我在羅馬可以看到全部米開朗基羅的作品嗎？", "s": "沒辦法，但你能看到他一生中最重量級的一半傑作。米開朗基羅這輩子留下的完整作品不到 50 件，主要分散在佛羅倫斯（故鄉與青年時期）和羅馬（壯年與晚年巔峰）兩座城市。去羅馬雖然看不到他最有名的《大衛像》或梅第奇禮拜堂，但你能看到他唯一的簽名作《聖殤》、震撼全世界的《西斯汀小堂》壁畫，以及聖彼得大教堂的大圓頂——可以說，他的大型壁畫與建築傑作幾乎全都在羅馬。", "b": [["h", "羅馬看得到什麼？（他的大型壁畫、建築與晚年傑作）"], ["p", "米開朗基羅在羅馬住了超過三十年，替歷任教宗工作，因此他一生中尺幅最大、工程最浩大的作品全都在羅馬。只要走訪羅馬市區與梵蒂岡，你就能集滿他的三大代表領域：雕刻有聖彼得大教堂的《聖殤》、聖伯多祿鎖鏈堂的《摩西》，以及神廟遺址聖母堂的《背負十字架的基督》；壁畫有西斯汀小堂的《創世紀》與《最後的審判》；建築則有聖彼得大教堂大圓頂與卡比托利歐山廣場。"], ["h", "哪些代表作不在羅馬？（大衛像在佛羅倫斯）"], ["p", "米開朗基羅是佛羅倫斯人，他早期的成名作以及替梅第奇家族創作的雕塑大多留在故鄉佛羅倫斯。最著名的《大衛像》（佛羅倫斯學院美術館）、唯一的圓形木板油畫《多尼圓幅》（烏菲茲美術館），以及為梅第奇家族設計的《新聖器室》陵墓群像（聖羅倫佐大殿），都必須專程去佛羅倫斯才看得到。"], ["h", "少數流落海外與北義的遺珠"], ["p", "除了羅馬與佛羅倫斯這兩大主場，只有極少數作品散落在其他地方：例如早期雕的《布魯日聖母》遠在比利時布魯日、《垂死的奴隸》被法國拿破崙帶走（現藏巴黎羅浮宮），而他過世前幾天還在敲打的最後遺作《隆達尼尼的聖殤》，則收藏在北義的米蘭斯福爾扎城堡。換句話說，在羅馬雖然看不到「全部」，但已經足以體驗他藝術生涯最壯闊的精華。"]]}, {"id": "Q5-3-2", "q": "米開朗基羅到底是畫家還是雕刻家？", "s": "他一直認為自己是雕刻家。即使被教宗要求畫西斯汀天頂，他在信件上的署名還是「雕刻家米開朗基羅」。他的雕刻作品也遠多於繪畫。", "b": [["h", "從小就是雕刻天才"], ["p", "他十五、六歲在梅第奇家族的花園學習時，就完成了浮雕《階梯聖母》和《半人馬之戰》。26 歲開始雕《大衛》，用的是一塊被別人刻壞、放了幾十年的大理石，29 歲完成（現在在佛羅倫斯學院美術館）。"], ["h", "作品數量"], ["p", "雕刻有四十多件；確定是他親筆的繪畫很少：西斯汀的天頂和《最後的審判》、梵蒂岡保祿小堂的兩幅晚年壁畫（一般不開放參觀），以及在佛羅倫斯的木板畫《多尼圓形畫》。"], ["h", "生前的地位"], ["p", "他活到 88 歲，服務過多位教宗，生前就有人為他寫傳記，被稱為「神聖的米開朗基羅」。名利雙收，但個性孤僻，常為了接不想接的工作而痛苦。"]]}, {"id": "Q5-3-3", "q": "米開朗基羅有發生什麼有名的軼事嗎？", "s": "米開朗基羅是藝術史上出了名的「暴躁完美主義者」，他性格孤僻、脾氣火爆，連教宗都敢頂撞。在羅馬創作期間留下了許多精彩軼事——包括為了證明《聖殤》是自己雕的而連夜偷偷刻上簽名、因為不滿教宗催促畫西斯汀天頂畫而把人趕下鷹架，以及在《最後的審判》裡把嫌棄裸體畫的教廷官員畫進地獄裡被毒蛇咬，每則故事都直接刻在他留下的作品細節裡。", "b": [["h", "一生唯一的簽名：偷偷溜進教堂刻在《聖殤》胸前"], ["p", "23 歲的米開朗基羅在羅馬完成《聖殤（Pietà）》後，某天混在人群裡聽見外地遊客誤以為這座精美雕像是另一位米蘭雕刻家的作品。年輕氣盛的他氣得當天夜裡提著燈籠與鑿子偷偷潛入聖彼得大教堂，在聖母瑪利亞胸前的肩帶上刻下「佛羅倫斯人米開朗基羅・博納羅蒂製造」——這也成為他一生所有雕塑中唯一一件有簽名的作品（之後他覺得出於虛榮刻字很幼稚，發誓再也不簽名）。"], ["h", "敢對教宗發脾氣：畫西斯汀小堂時把教宗趕下鷹架"], ["p", "教宗儒略二世強迫自認是雕塑家的米開朗基羅去畫西斯汀小堂天花板，米開朗基羅把所有助手都趕走、鎖上大門獨自仰頭苦畫四年，畫到脖子僵硬、顏料不斷滴進眼睛裡。期間心急的教宗不斷爬上鷹架催問「什麼時候才畫完？」，米開朗基羅每次都頂嘴回答「等我能畫完的時候！」，甚至有一次教宗氣得拿手杖打他，米開朗基羅直接收拾行李罷工逃回佛羅倫斯，最後還得由教宗低頭寫信道歉才把他請回來。"], ["h", "用畫筆報復酸民：把教廷禮儀官畫進《最後的審判》地獄裡"], ["p", "晚年他在西斯汀小堂畫《最後的審判》時，因為畫了大量全裸人物，被教廷禮儀官切塞納（Biagio da Cesena）當眾批評「這簡直像公共澡堂或酒館裡的淫穢畫，不配出現在教宗教堂」。米開朗基羅聽完一言不發，轉頭就把畫面右下角地獄判官米諾斯（Minos）的臉畫成這位禮儀官的長相，還幫他加上一對驢耳朵、讓一條大蛇死死咬住他的下體。切塞納氣得跑去向教宗告狀要求塗掉，教宗卻幽默地回答：「我的權力只管得到人間和煉獄，管不到地獄，你就待在那裡吧！」"]]}, {"id": "Q5-3-4", "q": "聽說他畫西斯汀天頂時還跟人吵架？", "s": "沒錯！他在畫西斯汀小堂天頂畫的四年裡幾乎從頭吵到尾，主要跟兩組人馬起衝突：一組是跟他搶地盤的「建築師布拉曼帖與拉斐爾陣營」（米開朗基羅深信是他們設局害他接下這份不擅長的壁畫苦差事，想看他出糗），另一組則是天天爬上鷹架催進度的「出資人教宗儒略二世」。這場明爭暗鬥不僅逼出了他的創作潛能，更讓他在畫裡留下偷看對手與回擊的戲劇故事。", "b": [["h", "懷疑被同行設局：與建築師布拉曼帖的「陰謀論」之爭"], ["p", "米開朗基羅原本正在興頭上，準備替教宗打造宏偉的陵墓雕塑，不料教宗突然喊停，改派他去畫西斯汀小堂的天花板。米開朗基羅當場氣炸，認定這是當時受寵的聖彼得大教堂建築師布拉曼帖（Bramante）在背後搞鬼——因為布拉曼帖忌妒米開朗基羅，故意向教宗推薦「讓雕塑家去畫高難度濕壁畫」，賭他一定會畫砸、從此失寵。兩人為此多次在教廷公開撕破臉，米開朗基羅甚至直接指控布拉曼帖在聖彼得大教堂工程中偷工減料。"], ["h", "防賊一樣防著拉斐爾：鎖門趕助手、深夜偷看對手"], ["p", "因為布拉曼帖與年輕的拉斐爾（Raphael）是同鄉兼好友，米開朗基羅連帶把拉斐爾也當成競爭假想敵。為了不讓技術外流，米開朗基羅把從佛羅倫斯請來的畫師助手全部趕走，鎖上西斯汀小堂大門一人獨自苦畫；不料有一次他暫時離開羅馬，負責保管鑰匙的布拉曼帖竟然偷偷開門放拉斐爾進去參觀未完成的天頂畫！拉斐爾看過後大受震撼，立刻在隔壁的《雅典學院》裡把米開朗基羅畫進畫面致敬，但米開朗基羅知道後依然氣得大罵兩人「像強盜一樣偷竊他的點子」。"], ["h", "跟大金主教宗對罵：拆掉鷹架、差點被手杖打"], ["p", "除了跟同行吵，他跟出資的教宗儒略二世更是三天一小吵、五天一大吵。教宗嫌他畫太慢，三不五時就爬上十幾公尺高的鷹架催進度，兩人常在半空中直接互吼——有一次教宗氣到舉起手杖威脅要打他，喊著「再不畫完就把你從鷹架上扔下去！」，米開朗基羅也毫不示弱回嗆，教宗一走他就立刻下令工人拆掉鷹架、提早公開前半段畫面，結果全羅馬（包括拉斐爾）看完都驚為天人，這才讓這場持續四年的「鷹架吵架大戲」以米開朗基羅大獲全勝收場。"]]}, {"id": "Q5-3-5", "q": "米開朗基羅總是在吵架，他是不得志的畫家嗎？", "s": "完全不是——他其實是藝術史上最得志、最富有的超級巨星！他在世時就被尊稱為「神聖的米開朗基羅（Il Divino）」，從 20 幾歲起就一路被佛羅倫斯富商與歷任羅馬教宗重金搶著聘請，晚年甚至累積了相當於現代億萬富翁的龐大財產。他之所以整天吵架，不是因為懷才不遇，而是因為他「太有底氣」加上「極度完美主義」——他深知全歐洲沒人能取代自己，連教宗都得讓他三分，同時他對創作有一種近乎偏執的責任感，容不得金主外行領導內行。", "b": [["h", "在世時就是「活傳奇」，財富與地位無人能及"], ["p", "不同於梵谷那種死後才成名的悲劇畫家，米開朗基羅在 25 歲雕出《聖殤》與《大衛》後就已經紅遍全義大利，一生服務過九位羅馬教宗，是第一位在世時就被出版傳記的藝術家。他靠著教廷與王公貴族的高額報酬與精明投資，晚年在羅馬與佛羅倫斯擁有大片房產與土地，遺產價值在當時堪稱天文數字——他從來不缺案子，只有他挑案子、沒有案子挑他。"], ["h", "他吵架是因為「專業傲氣」：容不得金主外行干涉"], ["p", "既然這麼得志，為什麼還整天跟教宗和同行翻臉？核心原因是他把創作視為神聖使命，極度痛恨出資者像對待普通工匠一樣指手畫腳。他跟教宗儒略二世吵架，是因為教宗不斷催進度、擅自更改陵墓預算，或想干涉西斯汀小堂的構圖；米開朗基羅深知全歐洲只有他畫得出這種等級的作品，因此每次吵架都敢直接罷工走人，逼得教宗反過來寫信低頭拜託他回來。"], ["h", "內心的「創作焦慮」：永遠覺得自己做得不夠好"], ["p", "除了對外傲氣，米開朗基羅其實是個極度自我折磨的完美主義者。他一生只對自己的雕塑感到滿意，被迫去畫西斯汀天頂畫或接手聖彼得大教堂建築工程時，內心其實充滿巨大壓力與自我懷疑，甚至寫詩抱怨畫壁畫讓自己「脊椎彎曲、臉上滴滿顏料」。這種高強度的精神緊繃，加上生性多疑、不擅社交，讓他把所有不理解他的人都當成敵人，才留下了「整天跟人吵架」的火爆名聲。"]]}, {"id": "Q5-4", "q": "拉斐爾在羅馬做了什麼？", "s": "拉斐爾（Raphael）雖然只在羅馬待了 12 年（1508 年至 1520 年 37 歲驟逝），卻在這裡迎來藝術生涯的最高峰，並成為羅馬盛期文藝復興的靈魂人物之一。他最核心的成就是替教宗繪製「拉斐爾畫室（Stanze di Raffaello）」壁畫（包含《雅典學院》），將古典哲學、理性秩序與柔和優雅的人文氣息推向極致；此外，他也接任聖彼得大教堂首席建築師、設計華麗的貴族宅邸與小禮拜堂，並帶出龐大的藝術工作室體系，把羅馬的優雅品味傳遍全歐洲。", "b": [["h", "壁畫巔峰：在梵蒂岡畫出《雅典學院》與「拉斐爾畫室」"], ["p", "拉斐爾 25 歲受教宗儒略二世徵召來到羅馬，起初只是替教宗的私人書房與寓所畫壁畫，沒想到畫出的《雅典學院（The School of Athens）》一鳴驚人——他把柏拉圖、亞里斯多德等古希臘哲學家安排在宏偉的透視拱廊大廳中，並偷偷把達文西、米開朗基羅與自己的臉畫進哲學家群像裡，用清晰構圖與溫和表情，完美詮釋了盛期文藝復興「理性、和諧與古典傳承」的理想。後來教宗甚至把原本請別人畫的房間也交給拉斐爾重畫，整套「拉斐爾畫室」成為羅馬文藝復興壁畫的典範。"], ["h", "跨足建築與貴族宅邸：接棒聖彼得大教堂與優雅宮殿"], ["p", "不同於米開朗基羅那種充滿掙扎與肌肉爆發力的風格，拉斐爾的作品給人一種從容、明亮、甚至帶點貴族氣質的優雅感。他在羅馬除了接手布拉曼帖過世後的聖彼得大教堂建築設計、提倡「保存古羅馬遺址」的考古觀念外，也替富商與教廷高官設計了許多精緻作品——例如基吉禮拜堂（Chigi Chapel）（位於人民聖母教堂內，融合建築、穹頂馬賽克與雕塑的早期整體藝術嘗試）以及充滿古典神話壁畫的法爾內西納別墅（Villa Farnesina）。"], ["h", "建立「大型工作室制度」與英年早逝的傳奇"], ["p", "拉斐爾性格溫和、善於協調人際，在羅馬帶領著數十位畫家與學徒組成的龐大創作團隊，像一位高效的藝術總監，同時推進壁畫、祭壇畫、掛毯設計與建築工程。正當他聲望如日中天、甚至一度傳出教宗有意提拔他當樞機主教時，卻在 1520 年 37 歲生日當天因突發高燒驟逝，葬在萬神殿裡。他的早逝讓羅馬失去了一股優雅平衡的力量，隨後經歷戰亂與宗教改革，羅馬藝術也逐漸從拉斐爾式的「和諧典範」走向更動盪激烈的轉折。"]]}, {"id": "Q5-4-1", "q": "我在羅馬可以看到全部拉斐爾的作品嗎？", "s": "沒辦法，但你能看到他一生中最宏大、最核心的「大型壁畫」與成熟期巔峰作品。拉斐爾一生創作量極大，且畫作尺寸多半便於移動，因此他的油畫作品大量分散在佛羅倫斯（早期代表作）以及巴黎羅浮宮、馬德里普拉多美術館、倫敦國家美術館等歐洲各大美術館。不過，因為壁畫「搬不走」，他藝術生涯最輝煌的《拉斐爾畫室》（包含《雅典學院》）、最終遺作《基督顯聖容》，以及他的陵墓（萬神殿）全都在羅馬，離開羅馬就絕對看不到他作為壁畫大師的真正高度。", "b": [["h", "羅馬看得到什麼？（搬不走的壁畫巔峰與最終遺作）"], ["p", "拉斐爾人生最後 12 年都在羅馬為教宗與頂級富商創作，因此他規模最大、構圖最複雜的大型濕壁畫全都在羅馬——最核心的就是梵蒂岡博物館裡的《拉斐爾畫室》（包含《雅典學院》），以及他過世前完成的最後一件油畫傑作《基督顯聖容（Transfiguration）》（現藏梵蒂岡畫廊）。此外，市區教堂與別墅裡還留有神話壁畫（如法爾內西納別墅的《凱旋的加拉泰亞》）、教堂壁畫《女先知》（和平聖母教堂），以及由他設計建築與馬賽克的基吉禮拜堂（人民聖母教堂內）。"], ["h", "哪些代表作不在羅馬？（柔美聖母像與王公肖像散布全歐）"], ["p", "不同於米開朗基羅以「搬不動的大型雕刻與壁畫」為主，拉斐爾在佛羅倫斯時期畫了大量適合私人收藏與教堂祭壇的木板油畫（尤其是各種溫柔甜美的聖母子像），成名後又替各國王公貴族畫了無數肖像畫。這些畫作因為容易運輸與買賣，早在幾百年前就被歐洲各國皇室收購——因此像《金翅雀聖母》、《椅子上的聖母》留在佛羅倫斯（烏菲茲與彼提宮），《草地上的聖母》在維也納，《西斯汀聖母》在德國德勒斯登，而巴黎羅浮宮與馬德里普拉多美術館也各自收藏了十幾幅他的油畫名作。"], ["h", "拉斐爾本人也長眠在羅馬（萬神殿）"], ["p", "除了作品之外，羅馬還有一個其他城市取代不了的特殊意義：拉斐爾的遺體就安葬在羅馬萬神殿裡。1520 年他 37 歲驟逝時，全羅馬陷入哀悼，教宗破例讓他葬在萬神殿這個古羅馬神聖殿堂中，墓碑上刻著著名的拉丁文墓誌銘：「他活著時，大自然害怕被他超越；他死去時，大自然害怕自己也隨之死去。」走一趟梵蒂岡加上萬神殿，就等於走完了他藝術生涯最璀璨的終章。"]]}, {"id": "Q5-4-2", "q": "拉斐爾也有身分認同的問題嗎？他是畫家還是雕刻家？", "s": "沒有，拉斐爾完全沒有米開朗基羅那種「被迫跨界」的身分糾結！他從頭到尾都是百分百純粹的「畫家」（後來自然延伸到建築設計與古蹟考古），幾乎不自己動手雕刻。相較於米開朗基羅總是一臉痛苦地喊著「我是雕塑家、不是畫家」，拉斐爾性格隨和靈活，只要教宗出題目——無論是畫壁畫、設計掛毯、蓋教堂還是畫舞台佈景——他都欣然接下，把自己定位為一位全能的「視覺與空間總監」。", "b": [["h", "純粹的畫家出身：從父親畫室一路畫到梵蒂岡"], ["p", "拉斐爾的父親本身就是烏爾比諾宮廷的畫師，他從小在畫室長大，後來拜入著名畫家佩魯吉諾門下，接受的是最正統的繪畫與濕壁畫訓練。與自幼在採石場長大、把鑿子當生命的米開朗基羅完全不同，拉斐爾一生幾乎沒有親自雕刻過石像（傳世僅有一兩件極具爭議、由他畫設計稿再交給雕塑工匠執行的作品），在羅馬你也不會看到「拉斐爾親手雕刻的雕像」。"], ["h", "沒有跨界包袱：從「畫家」自然升級成「建築師與考古總監」"], ["p", "雖然不碰雕刻，但拉斐爾在羅馬後期也像達文西一樣橫跨了多個領域，而且過程非常順理成章。1514 年建築師布拉曼帖過世後，拉斐爾直接接任聖彼得大教堂首席建築師，並設計了多座羅馬貴族宮殿與基吉禮拜堂；同時，教宗還任命他擔任「羅馬古蹟總監」，負責測量並繪製古羅馬廢墟地圖。他從來不會像米開朗基羅那樣抗拒新任務，而是把建築與古蹟研究當成繪畫空間美學的自然延伸。"], ["h", "「藝術總監」式的團隊合作，與米開朗基羅的孤狼性格完全相反"], ["p", "米開朗基羅之所以痛苦，是因為他凡事非得親力親為、連助手都趕走；拉斐爾則像一位現代設計公司的創意總監，他在羅馬帶領著幾十位專業助手（包括畫家、建築繪圖師、雕塑工匠與版畫師）。遇到不擅長的工藝（例如要把畫作織成巨幅掛毯，或在建築裡加入大理石雕塑），他只要畫出精準的設計草圖，就能放心交給團隊執行——這種開放、善於分工的性格，讓他完全沒有任何「身分認同焦慮」。"]]}, {"id": "Q5-4-3", "q": "拉斐爾有發生什麼有名的軼事嗎？", "s": "與孤僻暴躁的米開朗基羅完全相反，拉斐爾是羅馬社交圈的「萬人迷與風流才子」，長相俊美、性格溫和圓滑，連教宗與樞機主教都搶著把姪女嫁給他。他在羅馬最著名的軼事全都圍繞著他的好人緣、對同行的惺惺相惜，以及風流浪漫的愛情故事——包括在《雅典學院》裡偷偷畫進「米開朗基羅與自己」向大師致敬、為了專心畫畫把情婦接進別墅同住，甚至在萬神殿墓碑上留下一句讓後世傳頌五百年的浪漫墓誌銘。", "b": [["h", "最有風度的致敬：把暴躁的米開朗基羅畫進《雅典學院》"], ["p", "米開朗基羅一直把拉斐爾當成抄襲點子的假想敵，但拉斐爾卻對這位前輩充滿敬佩。1511 年布拉曼帖偷偷放拉斐爾進西斯汀小堂看未完成的天頂畫後，拉斐爾深受震撼，立刻在隔壁教宗書房的《雅典學院》正中央階梯上，臨時補畫了一位身穿工作長靴、手托下巴沉思的孤獨哲學家（赫拉克利特）——那張臉畫的正是米開朗基羅本人，而且還特意模仿米開朗基羅那種厚重如雕塑的畫風；而他自己則低調躲在畫面最右邊的角落，只露出一顆頭望向觀眾，高下立判的氣度成為藝術史美談。"], ["h", "為了愛人無心工作：金主乾脆把他的情婦「接進工地一起住」"], ["p", "拉斐爾雖然受教廷重用、甚至一度傳出教宗有意提拔他當樞機主教（為此他還婉拒了樞機主教姪女的婚事），但他私底下是個不折不扣的風流才子，與羅馬麵包師的女兒瑪格麗塔（La Fornarina）陷入熱戀。據文藝復興傳記作家瓦薩里記載，拉斐爾替富商基吉（Agostino Chigi）畫《法爾內西納別墅》壁畫時，因為太想念情人而頻頻溜班、進度嚴重落後；精明的金主基吉乾脆直接把瑪格麗塔接進別墅裡陪他住，拉斐爾這才心滿意足地留在工地乖乖把壁畫畫完。"], ["h", "37 歲生日當天驟逝，全羅馬哀悼並破例葬入萬神殿"], ["p", "1520 年 4 月 6 日（耶穌受難日），拉斐爾在自己 37 歲生日當天因突發高燒驟逝（當時盛傳是過度沉溺愛欲加上醫生誤診放血所致）。由於他人緣極好、幾乎沒有敵人，消息傳出後連教宗都痛哭失聲，全羅馬市民自動湧上街頭送葬，教廷更破例將他安葬在古羅馬神聖殿堂萬神殿（Pantheon）裡。他的好友紅衣主教本博（Pietro Bembo）在墓碑上為他寫下經典的拉丁文墓誌銘：「這裡躺著拉斐爾，他在世時，大自然害怕被他超越；他死去時，大自然害怕自己也隨之死去。」"]]}, {"id": "Q5-4-4", "q": "拉斐爾跟米開朗基羅的關係如何？", "s": "兩人的關係可以概括為「單方面的猜忌敵對，與另一方面的崇拜致敬」——簡直是藝術史上最經典的「I 人與 E 人」對決。性格孤僻多疑的米開朗基羅（長 8 歲）一直把年輕帥氣、人緣極好的拉斐爾當成「抄襲自己點子的假想敵與競爭對手」；但性格溫和圓滑的拉斐爾卻打從心底敬佩米開朗基羅的才華，不僅在畫作中模仿他的風格向他致敬，甚至直接把他的臉畫進《雅典學院》的正中央。", "b": [["h", "米開朗基羅視角：防賊一樣防著這個「愛抄襲的年輕人」"], ["p", "米開朗基羅性格孤僻、重度多疑，而拉斐爾偏偏是他死對頭建築師布拉曼帖的同鄉兼好友，因此米開朗基羅從一開始就把拉斐爾劃進「敵對陣營」。1511 年，布拉曼帖趁米開朗基羅不在羅馬時，偷偷開門放拉斐爾溜進西斯汀小堂偷看未完成的天頂畫；米開朗基羅回來發現拉斐爾的新畫作風格突然變得厚重有力，氣得在信裡大罵：「拉斐爾在藝術上所懂的一切，全都是從我這裡學（偷）來的！」他甚至連在街上遇見被一群學徒前呼後擁的拉斐爾時，都會冷冷嘲諷一句：「你走起路來簡直像個帶兵的將軍。」"], ["h", "拉斐爾視角：不計較冷眼，坦蕩蕩把前輩畫進《雅典學院》"], ["p", "面對前輩的尖酸刻薄，EQ 很高的拉斐爾從不惡言相向（他只溫和地回敬過一句：「而你孤單一人走起路來，就像個劊子手」）。拉斐爾在偷看到西斯汀小堂天頂畫後，不但不藏私，反而大方承認自己被米開朗基羅的宏大力量震撼了——他立刻修改隔壁教宗書房《雅典學院》的草稿，在畫面正中央的階梯上加畫了一位低頭沉思的哲學家（赫拉克利特），故意用米開朗基羅式的粗獷肌肉線條來畫，並把他的臉直接畫成米開朗基羅本人，用作品留下藝術史上最高雅的致敬。"], ["h", "一牆之隔的良性競爭，逼出兩人的最高巔峰"], ["p", "雖然私下沒有交情、甚至互不往來，但兩人在梵蒂岡宮廷「只隔幾道牆」同時創作的這幾年（1508–1512 年），卻成了藝術史上最精彩的良性競爭。教宗儒略二世刻意讓兩位天才打對台，兩人都知道隔壁房間正在誕生不朽傑作，誰也不敢掉以輕心——米開朗基羅在西斯汀小堂拼命把人體張力推向極限，拉斐爾則在隔壁畫室把空間構圖與色彩和諧做到完美，最終聯手把羅馬推上了盛期文藝復興的最高峰。"]]}, {"id": "Q5-4-5", "q": "聽起來後世對拉斐爾的評價比較好？", "s": "這取決於你在「哪個時代」問這個問題！後世對兩人的評價其實經歷了一場有趣的風水輪流轉：在 17 到 19 世紀（古典學院派時期），拉斐爾的評價全面壓倒米開朗基羅，被奉為「畫聖」與完美繪畫的最高教科書；但到了 19 世紀末至今（現代審美時期），風向大逆轉，現代人反而更推崇米開朗基羅那種打破常規、充滿痛苦掙扎與個人靈魂張力的「叛逆天才」，拉斐爾有時反而被嫌「太四平八穩、太甜美」。", "b": [["p", "兩人在不同時代的歷史地位變化："], ["h", "17–19 世紀的絕對王者：拉斐爾是所有美術學院的「標準答案」"], ["p", "在拉斐爾過世後的三百年間，歐洲各國成立了皇家美術學院（如法國與英國皇家藝術學院），教學講究「理性、優雅、對稱與和諧」——而拉斐爾正是這套標準的終極化身。當時的學院派教授認為，米開朗基羅的人體肌肉太誇張、情緒太激動，容易把學生教壞；唯有拉斐爾的構圖最平衡、色彩最柔和、表情最得體，因此尊稱他為「畫聖」，要求所有畫家臨摹他的作品，使他在那三百年間的學術地位遠高於米開朗基羅。"], ["h", "現代審美的大逆轉：米開朗基羅成了「現代藝術家精神」的原型"], ["p", "到了 19 世紀浪漫主義與 20 世紀現代藝術興起後，審美標準徹底翻轉——人們不再喜歡「完美無瑕的乖乖牌」，反而崇拜「忠於自我、敢於反抗權威、用生命燃燒靈魂的孤獨天才」。在現代人眼裡，拉斐爾畫得太順遂、太圓滑，甚至因為大量使用工作室助手而顯得不夠「純粹」；相反地，米開朗基羅那種跟教宗對罵、獨自仰頭苦畫四年、在《最後的審判》與晚年雕塑中流露出的巨大孤獨與靈魂掙扎，完全擊中了現代人的胃口，讓他在當代大眾文化中的知名度與震撼力反超拉斐爾。"], ["h", "總結兩人的歷史定位：「完美典範」vs.「突破極限」"], ["p", "簡單來說，藝術史對兩人的評價不是誰高誰低，而是兩種截然不同的最高境界：拉斐爾代表的是「和諧的極致」——他把前人累積的透視、色彩與構圖融合得無懈可擊，集大成卻不張揚；米開朗基羅代表的則是「力量的極致」——他不斷打破當時的審美規矩，親手把文藝復興推向巴洛克的大門。在羅馬同時看過《拉斐爾畫室》的優雅平靜與《西斯汀小堂》的排山倒海後，你就能親身體會這兩種截然不同的美學震撼。"]]}, {"id": "Q5-4-6", "q": "如果他這麼厲害，為什麼很少看到他的作品？", "s": "拉斐爾作品看起來「少」，其實是一個「壽命太短＋作品體積太大」的錯覺！他 37 歲就英年早逝，整個獨立創作生涯只有短短十幾年；而且他人生最後 12 年在羅馬幾乎把所有精力都投入在《拉斐爾畫室》巨幅壁畫、聖彼得大教堂建築工程，以及梵蒂岡掛毯設計這些超級大專案上——光是一面《雅典學院》壁畫的工作量就抵得上幾十幅普通油畫。如果把壁畫、祭壇畫、掛毯與素描全部算進去，他在短短十幾年內的產量其實驚人地高，只是能掛在美術館裡的「單幅油畫」比例較少而已。", "b": [["h", "原因一：37 歲驟逝，創作時間不到米開朗基羅的四分之一"], ["p", "這是影響總數最直接的物理限制。米開朗基羅活到 88 歲，整整創作了七十多年；而拉斐爾 1520 年在 37 歲生日當天突發高燒驟逝，扣除早年拜師學藝的時間，他真正作為獨立大師創作的黃金期只有短短 15 年左右。能在十幾年內留下上百件油畫與壁畫（還不含上千張素描手稿），平均每個月都在產出重量級作品，其實已經是藝術史上罕見的高產天才。"], ["h", "原因二：在羅馬接的都是「超大型工程」，不是單張油畫"], ["p", "一般遊客覺得某位畫家作品多，通常是因為在美術館看到很多框起來的「單幅油畫」；但拉斐爾 25 歲來到羅馬後，教宗交給他的全都是以「整棟建築、整個房間」為單位的超級大案子。他一個人要同時繪製梵蒂岡四個大房間的牆面壁畫（《拉斐爾畫室》）、接任聖彼得大教堂首席建築師、設計貴族別墅與禮拜堂，甚至還要畫十幅巨型掛毯設計圖——光是一個壁畫房間就得畫上好幾年，自然沒有多餘時間去畫大量方便流傳的個人小油畫。"], ["h", "原因三：晚期「工作室代筆」爭議，讓學界剔除不少作品"], ["p", "因為教宗和王公貴族的訂單多到接不完，拉斐爾在羅馬晚期成立了高達數十人的大型工作室，許多作品是由他畫草圖、再交給弟子上色完成（例如《拉斐爾畫室》最後一間《君士坦丁大廳》，以及許多晚期肖像畫）。後世藝術史學家為了區分「拉斐爾親筆真跡」與「工作室代筆」，把大量弟子參與度較高的作品從他的正式目錄中剔除，這也讓嚴格認證的「拉斐爾親筆油畫」數量看起來比實際更精簡。"]]}, {"id": "Q5-5", "q": "除了三傑，還有哪些文藝復興藝術家值得認識？", "s": "在羅馬可以再認識建築師布拉曼帖、畫家塞巴斯蒂亞諾和拉斐爾的大弟子朱利歐·羅馬諾。放眼全義大利，還有佛羅倫斯的波提切利、多那太羅，威尼斯的提香，以及帕爾馬的柯雷喬。", "b": [["h", "在羅馬"], ["li", "**布拉曼帖**：新聖彼得大教堂的第一任設計師，在聖伯多祿蒙托里奧堂旁蓋了小圓廟「坦比哀多小禮拜堂」，是文藝復興建築的經典。"], ["li", "**塞巴斯蒂亞諾**：來自威尼斯的畫家，和米開朗基羅交好，把米開朗基羅的人體和威尼斯的色彩結合（代表作在聖伯多祿蒙托里奧堂）。"], ["li", "**朱利歐·羅馬諾**：拉斐爾的大弟子，拉斐爾過世後接手完成梵蒂岡的壁畫。"], ["h", "義大利其他地方"], ["li", "**佛羅倫斯**：波提切利（《維納斯的誕生》；西斯汀小堂側牆也有他的壁畫）、透視法先驅馬薩其奧、雕刻家多那太羅。"], ["li", "**威尼斯**：提香、喬爾喬內、維洛內塞。"], ["li", "**帕爾馬**：柯雷喬，他畫的教堂圓頂讓人物像飛向天空，比巴洛克早了將近一百年。"]]}, {"id": "Q5-5-1", "q": "提香是誰？為什麼大家好像比較不熟？", "s": "提香是威尼斯最重要的畫家，以色彩著稱，在 16 世紀歐洲王室眼中地位不輸三傑。大家比較不熟，是因為他專心畫油畫，沒有發明、建築這類話題，作品又分散在威尼斯和各國的博物館。", "b": [["p", "他常直接用顏料在畫布上一層層堆出光影和肌膚的質感。相傳神聖羅馬帝國皇帝查理五世曾親自彎腰幫他撿起掉落的畫筆。羅馬的博爾蓋賽美術館有他的名作《神聖與世俗之愛》。"]]}, {"id": "Q5-6", "q": "整理一下：在羅馬看文藝復興，要看什麼？", "s": "先知道教宗為什麼出錢，再認清米開朗基羅和拉斐爾兩人的風格，最後在作品前找三個特徵：透視、真實的人體比例、像真人一樣的臉。", "b": [["h", "第一步：教宗的目的"], ["p", "16 世紀初的教宗要讓梵蒂岡成為全歐洲的中心，所以把最好的藝術家請來，集中在梵蒂岡和聖彼得大教堂。"], ["h", "第二步：認兩個人"], ["p", "肌肉強壯、氣勢悲壯的是米開朗基羅；構圖對稱、溫和優雅的是拉斐爾。"], ["h", "第三步：找三個特徵"], ["li", "有沒有往遠處延伸的空間（透視）。"], ["li", "人體的骨骼、肌肉是不是符合真實。"], ["li", "臉孔是不是像一般人，有自己的表情。"], ["p", "三個都對上，就是盛期文藝復興的作品。"]]}]}, {"title": "六、從文藝復興到巴洛克", "era": "bar", "qs": [{"id": "Q6", "q": "文藝復興後來為什麼變成巴洛克？", "s": "有兩個原因。外在是宗教改革：天主教流失大量信徒，教廷要求藝術要容易懂、能打動人。內在是風格的變化：米開朗基羅和拉斐爾已經把和諧完美做到頂點，後來的藝術家只能另找方向。", "b": [["h", "外在原因：宗教改革"], ["li", "**1517 年**：馬丁路德發起宗教改革，新教批評天主教奢華，許多地區脫離天主教。"], ["li", "**1527 年**：神聖羅馬帝國的軍隊洗劫羅馬，盛期文藝復興在羅馬的榮景就此結束。"], ["li", "**1545–1563 年**：天主教召開特倫托會議，規定宗教藝術要清楚易懂、能引發信徒的情感。"], ["h", "內在原因：完美之後怎麼辦"], ["p", "米開朗基羅和拉斐爾之後，年輕的藝術家很難在「和諧完美」上超越他們。16 世紀中後期先出現一段刻意拉長、扭曲人體的「矯飾主義」；到了 1600 年前後，卡拉瓦喬和貝尼尼找到新的方向，巴洛克就此成形。"]]}, {"id": "Q6-1", "q": "巴洛克有什麼特點？", "s": "巴洛克打破文藝復興的冷靜和對稱，改用斜向的動態構圖、強烈的明暗對比、情緒激烈的表情，以及讓人分不清真假的空間效果，目的是第一眼就打動觀眾。", "b": [["li", "**強烈明暗**：背景幾乎全黑，只有一道強光打在主角身上。卡拉瓦喬的畫最明顯。"], ["li", "**動態構圖**：不再左右對稱，改用斜線和扭轉的身體，連大理石雕的衣袍都像被風吹起。"], ["li", "**情緒激烈**：表情停在驚恐、狂喜或痛苦最強烈的那一刻。"], ["li", "**空間錯覺**：繪畫、雕塑和建築結合，天花板畫得像屋頂打開、直通天空，例如聖依納爵教堂的天頂畫。"]]}, {"id": "Q6-2", "q": "和文藝復興比，巴洛克哪些是延續，哪些是改變？", "s": "透視、真人表情、用真人當模特兒，這三點巴洛克都繼續往前推；只有「冷靜優雅」被完全改掉，換成動態和戲劇性。", "b": [["li", "**透視：更進一步**。文藝復興用透視畫出深遠的空間；巴洛克用透視製造錯覺，天花板畫得像通往天空，人物的手腳像要伸出畫面。"], ["li", "**表情：更強烈**。文藝復興的表情含蓄，例如《聖殤》裡隱忍的哀傷；巴洛克直接畫出大叫、流淚、狂喜。"], ["li", "**模特兒：更貼近真實**。文藝復興雖然用真人，但會美化；卡拉瓦喬找街上的工人、農民來演聖人，連髒污的腳底都照實畫出來，強調神蹟就發生在普通人身邊。"], ["li", "**冷靜優雅：完全改變**。教廷認為站得端正、左右對稱的畫面太冷靜，打動不了信徒，所以改用扭轉的身體、飛揚的衣袍和斜射的光。"]]}, {"id": "Q6-3", "q": "文藝復興和巴洛克，哪一個比較偉大？", "s": "沒有誰比較偉大。文藝復興建立了透視和人體的規則；巴洛克在這些規則上，把光影、動態和情緒推到極致。在羅馬兩者都看，才是完整的羅馬。", "b": [["p", "文藝復興的貢獻是建立方法：證明人可以用數學和觀察重現真實世界，後來所有寫實藝術都以此為基礎。巴洛克的貢獻是運用方法：讓雕塑有皮膚的柔軟、讓光線帶出情緒，觀眾不只是欣賞，而是被作品打動。逛羅馬時，可以在梵蒂岡看文藝復興，走到廣場和教堂看巴洛克。"]]}]}, {"title": "七、巴洛克在羅馬", "era": "bar", "qs": [{"id": "Q7", "q": "巴洛克時代，羅馬扮演什麼角色？", "s": "羅馬是巴洛克的發源地。文藝復興是從佛羅倫斯開始、在羅馬達到高峰；巴洛克則直接在羅馬誕生，再傳到義大利各地和全歐洲。", "b": [["h", "在羅馬誕生"], ["p", "卡拉瓦喬的明暗畫法、貝尼尼的動態雕塑、波羅米尼的曲線建築，都是 17 世紀初在羅馬發展成熟的。"], ["h", "整座城市都是巴洛克"], ["p", "在巴黎或馬德里，巴洛克多半集中在宮殿和少數教堂；在羅馬，從聖彼得大教堂前的柱廊、納沃納廣場、特雷維噴泉，到街角的小教堂，大部分的街景都是巴洛克時期留下的。"], ["h", "全歐洲來學習"], ["p", "17 世紀的義大利在政治和貿易上已經落後西班牙、法國和荷蘭，但藝術上仍是全歐洲學習的對象。魯本斯、委拉斯開茲都曾到義大利學習；貝尼尼也在 1665 年受法國國王邀請到巴黎設計羅浮宮東側，不過他的方案最後沒有被採用。"]]}, {"id": "Q7-1", "q": "羅馬的巴洛克由誰主導？", "s": "三個人：做雕塑、噴泉和廣場的貝尼尼，畫強烈明暗油畫的卡拉瓦喬，以及蓋曲線教堂的建築師波羅米尼。", "b": [["li", "**貝尼尼**：雕刻家兼建築師，深受多位教宗信任，羅馬最重要的廣場和噴泉幾乎都出自他手。"], ["li", "**卡拉瓦喬**：畫家，在羅馬只活躍了十幾年，但他的明暗畫法影響了整個歐洲。"], ["li", "**波羅米尼**：建築師，貝尼尼最大的對手，用波浪般的曲線和幾何設計教堂。"]]}, {"id": "Q7-1-1", "q": "貝尼尼在羅馬留下了什麼？", "s": "博爾蓋賽美術館的雕像群、納沃納廣場的四河噴泉、聖彼得大教堂前的柱廊和教堂裡的青銅華蓋、勝利之后聖母堂的《聖女大德蘭的神魂超拔》，以及聖天使橋上的天使。", "b": [["h", "主要作品"], ["li", "**博爾蓋賽美術館**：《阿波羅與達芙妮》、《劫掠普洛塞庇娜》、《大衛》，都是他二十多歲的作品。"], ["li", "**廣場與噴泉**：納沃納廣場的四河噴泉、神廟遺址聖母堂前的大象方尖碑。"], ["li", "**聖天使橋**：橋上十尊天使由他設計，多數由弟子雕刻。"], ["li", "**聖彼得大教堂**：教堂前環抱廣場的柱廊、教堂裡的青銅華蓋。"], ["li", "**勝利之后聖母堂**：《聖女大德蘭的神魂超拔》。"], ["h", "他是什麼樣的人"], ["p", "他活到 81 歲，經營一個龐大的工作室，帶著數十位助手完成大量作品。據早期傳記記載，他也畫了不少油畫，多是肖像，但只是業餘興趣。"], ["h", "和米開朗基羅比較"], ["p", "米開朗基羅過世 34 年後貝尼尼才出生，兩人沒有同時代過。兩人都深受教宗重用；米開朗基羅的雕像肌肉緊繃、力量內斂，貝尼尼則把大理石雕出皮膚的柔軟和動作的瞬間。貝尼尼一生崇拜米開朗基羅，他的《大衛》就是一個正在投石的動態版本。"]]}, {"id": "Q7-1-2", "q": "卡拉瓦喬在羅馬留下了什麼？他是個什麼樣的人？", "s": "他的畫有很多免費掛在羅馬的教堂裡，最有名的是聖王路易堂的聖馬太三幅畫。他個性暴烈，1606 年在羅馬殺了人，之後一路逃亡，四年後死在路上。", "b": [["h", "在羅馬哪裡看"], ["li", "**聖王路易堂**（免費）：《聖馬太蒙召》等聖馬太三幅畫。"], ["li", "**人民聖母教堂**（免費）：《聖保羅的皈依》、《聖彼得受難》。"], ["li", "**聖奧斯定聖殿**（免費）：《洛雷托聖母》。"], ["li", "**博爾蓋賽美術館**：《提著歌利亞頭的大衛》、《捧果籃的少年》等多幅。"], ["li", "**多利亞潘菲利美術館**、**巴貝里尼宮**：也各有收藏。"], ["h", "他的一生"], ["p", "他隨身帶劍，在羅馬多次因鬥毆被捕。1606 年在一場爭執中殺了人（常見的說法是網球比賽的賭注），被判死刑，只好逃離羅馬，先後到了拿坡里、馬爾他和西西里。1610 年他在等待教宗特赦的途中過世，年僅 38 歲。"]]}, {"id": "Q7-1-3", "q": "波羅米尼是誰？為什麼比較少人知道他？", "s": "他只做建築，沒有容易記住的雕像或畫作；個性孤僻，在教宗面前比不過善於交際的貝尼尼，接到的多是小型教堂。但他的建築設計在建築史上評價非常高。", "b": [["h", "代表作"], ["li", "**四泉聖嘉祿堂**：外牆像波浪一樣起伏，內部是橢圓形圓頂，天花板布滿幾何圖案。"], ["li", "**聖依華堂**：螺旋形的尖塔，內部平面是六角星形。"], ["li", "**聖依搦斯堂**：在納沃納廣場，正對貝尼尼的四河噴泉。"], ["h", "為什麼比較少人知道"], ["li", "一般人記住藝術家，多半是靠人物雕像或畫作，建築比較抽象。"], ["li", "他是石匠出身，個性內向，不擅長和權貴打交道。貝尼尼接到聖彼得大教堂這類大工程，他接到的多是修會的小教堂。"], ["li", "他的教堂藏在老城區的巷子裡，很容易錯過。他晚年受憂鬱所苦，1667 年過世。"]]}, {"id": "Q7-1-4", "q": "義大利其他的巴洛克藝術家還有誰？", "s": "波隆那出身的卡拉奇和圭多·雷尼，在動感中保留文藝復興的優雅線條；科爾托納擅長讓天花板看起來直通天空的天頂壁畫；瓜里尼把波羅米尼的幾何建築帶到杜林。", "b": [["li", "**卡拉奇**：在羅馬法爾內塞宮畫了神話主題的天頂畫，影響了後來的學院派。"], ["li", "**圭多·雷尼**：畫風優雅柔和。"], ["li", "**科爾托納**：巴貝里尼宮的天頂壁畫，後來也去佛羅倫斯畫彼提宮。"], ["li", "**瓜里尼**：在杜林設計了層層交疊的鏤空圓頂。"]]}, {"id": "Q7-2", "q": "這些巴洛克作品現在都還在羅馬嗎？", "s": "貝尼尼和波羅米尼的作品幾乎都在原地，因為噴泉、廣場和建築搬不走。卡拉瓦喬的畫羅馬最多，但也有不少因為他逃亡和各國收藏，分散在南義、馬爾他和歐洲的大博物館。", "b": [["h", "卡拉瓦喬在羅馬以外"], ["li", "**逃亡路線上**：馬爾他瓦萊塔的聖約翰副主教座堂有《施洗者聖約翰被斬首》，是他唯一簽了名的畫；拿坡里和西西里也有他的作品。"], ["li", "**歐洲博物館**：《聖母之死》在巴黎羅浮宮，《以馬忤斯的晚餐》在倫敦國家藝廊，佛羅倫斯烏菲茲美術館有《酒神巴克斯》和《美杜莎》。"]]}]}, {"title": "八、巴洛克傳出羅馬", "era": "bar", "qs": [{"id": "Q8", "q": "巴洛克在義大利其他城市怎麼發展？", "s": "各地依自己的條件發展出不同的樣子：杜林是幾何建築，拿坡里是極端寫實的雕刻和繪畫，西西里在大地震後重建了整座巴洛克城鎮，威尼斯則結合了水上的光影和舞台般的華麗。", "b": [["li", "**杜林**：薩伏依王室所在地。建築師瓜里尼設計了層層交疊的鏤空圓頂（例如聖老楞佐教堂）。"], ["li", "**拿坡里**：卡拉瓦喬曾逃到這裡，影響了當地畫家里貝拉等人。18 世紀的大理石雕像《蒙紗的基督》，把薄紗雕得像真的半透明。"], ["li", "**西西里**：1693 年大地震摧毀了東南部，當地用金黃色的石灰岩重建了諾托、莫迪卡等整座巴洛克城鎮。"], ["li", "**威尼斯**：代表是安康聖母大殿。18 世紀的威尼斯繪畫也帶出了較輕快的洛可可。"]]}, {"id": "Q8-1", "q": "佛羅倫斯沒有巴洛克嗎？", "s": "有，但多半在室內。佛羅倫斯的街道在文藝復興時就已經蓋滿，也沒人想拆掉那些建築；巴洛克主要出現在梅第奇家族的彼提宮天花板上。", "b": [["h", "街上看不到的原因"], ["p", "佛羅倫斯人以文藝復興為傲，主教座堂、市政廳和主要廣場早在 15 世紀就已完成，不會為了新風格去改建。"], ["h", "在宮殿裡"], ["p", "17 世紀的梅第奇家族已是托斯卡尼大公，他們從羅馬請來科爾托納，在彼提宮的廳室天花板畫了金色灰泥裝飾和眾神壁畫。佛羅倫斯本地的巴洛克畫家（例如卡洛·多爾奇）也保留了細膩、克制的畫風，不像羅馬和拿坡里那麼強烈。"]]}, {"id": "Q8-2", "q": "巴洛克在歐洲其他國家怎麼發展？", "s": "出錢的人不同，巴洛克就長得不同：法國由國王出錢，變成莊嚴對稱的宮廷風格；荷蘭由商人出錢，變成描繪日常生活的光影畫；西班牙和葡萄牙把它帶到中南美洲，變成貼滿金飾的教堂。", "b": [["li", "**法國**：路易十四出錢，把義大利巴洛克的激情收斂成莊嚴對稱，代表是凡爾賽宮。"], ["li", "**荷蘭**：信奉新教、沒有國王，出錢的是商人和中產階級。林布蘭用光影刻畫人的內心，維梅爾畫窗邊的日常生活（《戴珍珠耳環的少女》）。"], ["li", "**法蘭德斯（今比利時）**：信奉天主教，魯本斯畫了大量充滿動感的巨幅作品。"], ["li", "**西班牙**：宮廷畫家委拉斯開茲的《宮女》，在畫裡玩起觀看者和被畫者的空間關係。"], ["li", "**奧地利和南德**：皇室和修道院把金箔、粉彩和天頂畫用到極致，例如維也納的美景宮。"], ["li", "**中南美洲**：西班牙和葡萄牙的傳教士把巴洛克帶到墨西哥、秘魯和巴西，教堂貼滿金飾和繁複雕刻，有時還融入當地的植物和圖騰。"]]}]}, {"title": "九、巴洛克之後", "era": "aft", "qs": [{"id": "Q9", "q": "巴洛克是怎麼結束的？", "s": "18 世紀時，巴洛克在法國變成輕快甜美的洛可可；同時啟蒙運動推崇理性和節制，龐貝古城又被挖掘出來，歐洲開始流行簡潔的新古典主義，巴洛克就退場了。", "b": [["h", "變成洛可可"], ["p", "18 世紀初的法國貴族不需要沉重的宗教作品，把巴洛克的曲線搬進私人客廳，顏色改成粉紅、粉藍，題材變成貴族的戀愛和遊樂。"], ["h", "啟蒙運動"], ["p", "伏爾泰等思想家批評王室和教會奢華。藝術史學家溫克爾曼提出藝術應該追求「高貴的單純、靜穆的偉大」。"], ["h", "龐貝出土"], ["p", "1748 年開始大規模挖掘龐貝，古羅馬簡潔、對稱的壁畫和雕像讓全歐洲著迷，掀起新古典主義，代表人物是法國畫家大衛。"]]}, {"id": "Q9-1", "q": "巴洛克之後，羅馬還留下了什麼？", "s": "有三樣比較明顯：卡諾瓦的新古典雕塑、義大利統一後蓋的維托里亞諾紀念堂，以及墨索里尼時期在城南蓋的 EUR 區。", "b": [["li", "**新古典主義（18 世紀末–19 世紀初）**：雕刻家卡諾瓦在羅馬工作，博爾蓋賽美術館的《寶琳娜·波拿巴》是代表作。"], ["li", "**維托里亞諾（1885–1935）**：1870 年義大利統一、定都羅馬後，在威尼斯廣場蓋的白色大理石紀念堂。外型像放大的古羅馬神殿，常被誤以為是古蹟。"], ["li", "**EUR 區（1930–40 年代）**：墨索里尼時期在城南建的新區，代表建築「義大利文明宮」用現代的方正造型模仿古羅馬的拱門。"], ["p", "這些作品多半是在向羅馬過去的輝煌致敬，所以導覽的重點還是放在古羅馬、文藝復興和巴洛克。"]]}]}, {"title": "十、總結", "era": "", "qs": [{"id": "Q10", "q": "今天的羅馬，主要是由哪些藝術家塑造的？", "s": "米開朗基羅、拉斐爾、貝尼尼、波羅米尼和卡拉瓦喬，再加上無數沒有留下名字的工匠。", "b": [["li", "**米開朗基羅**：聖彼得大教堂的圓頂、卡比托利歐山的廣場、西斯汀小堂的壁畫。"], ["li", "**拉斐爾**：梵蒂岡的拉斐爾房間；葬在萬神殿。"], ["li", "**貝尼尼**：四河噴泉、聖天使橋、聖彼得大教堂前的柱廊。"], ["li", "**波羅米尼**：四泉聖嘉祿堂、聖依華堂。"], ["li", "**卡拉瓦喬**：聖王路易堂、人民聖母教堂等教堂裡的祭壇畫。"], ["li", "**無名工匠**：採石工、石匠、青銅鑄造師和馬賽克工匠，把藝術家的設計變成實物。"]]}, {"id": "Q10-1", "q": "怎麼安排一條路線，一次看米開朗基羅、拉斐爾、貝尼尼和卡拉瓦喬？", "s": "從競技場旁的聖伯多祿鎖鏈堂出發，一路往西北走：卡比托利歐山 → 神廟遺址聖母堂 → 萬神殿 → 聖王路易堂 → 納沃納廣場與和平聖母堂 → 聖天使城堡 → 梵蒂岡。建議分兩天走。", "b": [["ol", "**聖伯多祿鎖鏈堂**：米開朗基羅的《摩西》。"], ["ol", "**卡比托利歐山**：米開朗基羅設計的廣場和星形地面。"], ["ol", "**神廟遺址聖母堂**：米開朗基羅的《復活的基督》；門外是貝尼尼設計的大象方尖碑。"], ["ol", "**萬神殿**：拉斐爾的墓（要買票，建議先預約）。"], ["ol", "**聖王路易堂**：卡拉瓦喬的聖馬太三幅畫（免費）。"], ["ol", "**納沃納廣場與和平聖母堂**：貝尼尼的四河噴泉；步行 3 分鐘到和平聖母堂看拉斐爾的《女先知》。"], ["ol", "**聖天使城堡與聖天使橋**：過橋時看貝尼尼設計的十尊天使。"], ["ol", "**梵蒂岡**：聖彼得大教堂裡有米開朗基羅的《聖殤》和圓頂、貝尼尼的柱廊和青銅華蓋；梵蒂岡博物館裡有拉斐爾房間和西斯汀小堂（博物館務必提前預約，週日休館；教堂和博物館都不能穿無袖、露肩或短褲短裙）。"]]}]}];

const dimDots = () => $$("#mini .dot").forEach(d => d.classList.toggle("dim", !d.dataset.e.split(" ").some(x => efOn.has(x))));
function drawMini() {
  const all = [...new Set(Object.keys(SPOTINFO).concat(WALKS.flatMap(w => w.stops)))].filter(id => SPOTS[id]);
  const pts = all.concat("hotel").map(id => SPOTS[id]);
  const la0 = Math.min(...pts.map(p => p.lat)) - .0025, la1 = Math.max(...pts.map(p => p.lat)) + .0025;
  const lo0 = Math.min(...pts.map(p => p.lon)) - .006, lo1 = Math.max(...pts.map(p => p.lon)) + .006;
  const W = 600, k = Math.cos(41.9 * Math.PI / 180), sx = W / ((lo1 - lo0) * k), H = (la1 - la0) * sx;
  $("#mini").setAttribute("viewBox", `0 0 ${W} ${H.toFixed(0)}`);
  const P = s => [((s.lon - lo0) * k * sx), ((la1 - s.lat) * sx)];
  let g = "";
  all.forEach(id => {
    const [x, y] = P(SPOTS[id]); const es = spotEras(id); const main = SPOTINFO[id];
    const ring = es.length > 1 ? `<circle r="10" fill="none" stroke="${cvar(es[1])}" stroke-width="2.5"/>` : "";
    g += `<g class="dot" data-s="${id}" data-e="${es.join(" ") || "x"}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${ring}<circle r="${main ? 6.5 : 4.5}" fill="${main ? cvar(es[0]) : "var(--mute)"}" stroke="var(--card)" stroke-width="1.5"/>${main ? `<text>${esc(SPOTS[id].n)}</text>` : ""}<circle r="16" fill="transparent"/></g>`;
  });
  const [hx, hy] = P(SPOTS.hotel);
  g += `<g transform="translate(${hx},${hy})"><rect x="-6" y="-6" width="12" height="12" fill="var(--ink)" stroke="var(--card)" stroke-width="1.5"/></g>`;
  $("#mini").innerHTML = g;
  const vb = $("#mini").viewBox.baseVal, ob = [];
  $$("#mini g").forEach(gr => { const m = gr.transform.baseVal[0].matrix; ob.push([m.e - 7, m.f - 7, m.e + 7, m.f + 7]); });
  const hit = r => r[0] < 2 || r[2] > vb.width - 2 || r[1] < 2 || r[3] > vb.height - 2 || ob.some(o => r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]);
  $$("#mini .dot text").forEach(t => {
    const b = t.getBBox(), m = t.parentNode.transform.baseVal[0].matrix, w = b.width, h = b.height;
    const opts = [[10, 4, "start"], [-10, 4, "end"], [-w / 2, -10, "start"], [-w / 2, 17, "start"], [10, -8, "start"], [10, 16, "start"], [-10, -8, "end"], [-10, 16, "end"]];
    for (const [dx, dy, an] of opts) {
      const x0 = an === "end" ? m.e + dx - w : m.e + dx, r = [x0, m.f + dy - h * .78, x0 + w, m.f + dy + h * .22];
      if (!hit(r)) { t.setAttribute("x", dx); t.setAttribute("y", dy); t.setAttribute("text-anchor", an); ob.push(r); return; }
    }
    t.remove();
  });
  dimDots();
}

/* ---------- drawer ---------- */
const dr = $("#dr"), scrim = $("#scrim");
function openDrawer(html) { dr.innerHTML = `<button class="x" aria-label="關閉">×</button>` + html; dr.classList.add("on"); scrim.classList.add("on"); dr.scrollTop = 0; }
function closeDrawer() { dr.classList.remove("on"); scrim.classList.remove("on"); }
function showQ(id) {
  const q = Q[id]; if (!q) return;
  const p = parentOf(id), k = kids[id] || [];
  openDrawer(`<div style="--c:${cvar(q.era)}"><div class="eyebrow">${esc(q.sec.title)}　${id}</div><h2>${esc(q.q)}</h2><p class="sub">${rich(q.s).replace(/\n/g, "<br>")}</p><div class="qb">${body(q.b)}</div>
    ${p ? `<div class="more"><b>上一題</b>${qChip(p, true)}</div>` : ""}
    ${k.length ? `<div class="more"><b>接著問</b>${k.map(x => qChip(x, true)).join("")}</div>` : ""}
    <div class="btns" style="margin-top:16px"><button class="btn" data-goto="${id}">在問答裡看</button></div></div>`);
}
function showSpot(id) {
  const s = SPOTS[id]; if (!s) return; const info = SPOTINFO[id], es = spotEras(id);
  const qs = [...new Set([...(mentions[id] || []), ...(info ? info[2].split(" ").filter(Boolean) : [])])].filter(x => Q[x]).sort((a, b) => QA.indexOf(Q[a]) - QA.indexOf(Q[b]));
  const walks = WALKS.filter(w => w.stops.includes(id));
  openDrawer(`<div class="eyebrow" style="--c:${cvar(es[0])}">${es.map(e => ERA[e].name).join("・") || "羅馬地圖上的景點"}</div><h2>${esc(s.n)}</h2><div style="color:var(--mute);font-size:14px">${esc(s.l)}</div>
    ${info ? `<p class="sub" style="margin-top:10px">${linkify(esc(info[1]))}</p>` : ""}
    <div class="btns"><a class="btn pri" href="${MAP_URL}#spot=${id}" target="_blank" rel="noopener">在我的羅馬地圖打開 ↗</a><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.l.includes("Roma") ? s.l : s.l + ", Roma")}" target="_blank" rel="noopener">Google 地圖 ↗</a></div>
    ${walks.length ? `<p style="font-size:15px"><b>地圖上的 City Walk：</b>${walks.map(w => w.name).join("、")}</p>` : ""}
    ${qs.length ? `<div class="more"><b>相關問答</b>${qs.map(x => qChip(x, true)).join("")}</div>` : ""}`);
}
function showG(name) {
  openDrawer(`<div class="eyebrow">羅馬地圖上還沒有這個點</div><h2>${esc(name)}</h2><div class="btns"><a class="btn pri" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ", Roma")}" target="_blank" rel="noopener">Google 地圖 ↗</a></div>`);
}
function setView(v, keep) {
  $$("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  $$("section.view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  if (!keep) window.scrollTo(0, 0);
  if (v === "spots" && !drawn) { drawMini(); drawn = true; }
  try { localStorage.setItem("art-rome-view2", v); } catch (e) {}
}
function gotoQ(id) {
  closeDrawer();
  if (Q[id].sec === PRE) { setView("flow", true); $("#qi-" + id).scrollIntoView({ block: "start" }); return; }
  setView("qa", true); $("#q").value = "";
  showSec(SECS.indexOf(Q[id].sec), id);
}
document.addEventListener("click", ev => {
  const f = ev.target.closest(".fold, #preqa .qt");
  if (f) { const qi = f.closest(".qi"), on = qi.classList.toggle("open"); const b = qi.querySelector(".fold"); b.setAttribute("aria-expanded", on); b.textContent = on ? "收起 ▴" : "看詳答 ▾"; return; }
  const t = ev.target.closest("[data-q],[data-s],[data-g],[data-goto],[data-sec],[data-oq],.x,#tocbtn");
  if (!t) return;
  if (t.classList.contains("x")) return closeDrawer();
  if (t.id === "tocbtn") { openDrawer(`<h2>目錄</h2><div id="outline2"></div>`); buildOutline($("#outline2")); return; }
  if (t.dataset.sec) { closeDrawer(); $("#q").value = ""; showSec(+t.dataset.sec); return; }
  if (t.dataset.oq) { closeDrawer(); $("#q").value = ""; const q = Q[t.dataset.oq]; showSec(SECS.indexOf(q.sec), q.id); return; }
  if (t.dataset.goto) return gotoQ(t.dataset.goto);
  ev.stopPropagation();
  if (t.dataset.q) showQ(t.dataset.q); else if (t.dataset.s) showSpot(t.dataset.s); else if (t.dataset.g) showG(t.dataset.g);
}, true);
scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
$$("nav button").forEach(b => b.addEventListener("click", () => setView(b.dataset.v)));
let tm; $("#q").addEventListener("input", e => { clearTimeout(tm); tm = setTimeout(() => search(e.target.value), 200); });

buildQA(); buildFlow(); buildSpots();
const u = document.getElementById("upd"); if (u) u.textContent = window.__upd || BUILT;
try { const v = localStorage.getItem("art-rome-view2"); if (v && v !== "flow") setView(v); } catch (e) {}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>義大利旅遊地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
:root { --bg: #F4F1E8; --card: #FBF9F3; --ink: #2A2724; --muted: #6E675D; --line: #DCD5C4; --accent: #9E2A2B; --wall: #6E7E4C; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #1B1A18; --card: #24221F; --ink: #EDE8DD; --muted: #A9A193; --line: #3A3631; --accent: #E07A6F; --wall: #9DB070; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Noto Sans TC", system-ui, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 48px max(18px, env(safe-area-inset-right)) 48px max(18px, env(safe-area-inset-left)); }
.kicker { font: italic 600 20px "Cormorant Garamond", Garamond, serif; color: var(--accent); margin: 0; }
h1 { font: 700 34px/1.25 "Noto Serif TC", serif; margin: 4px 0 8px; text-wrap: balance; }
.lead { color: var(--muted); margin: 0 0 28px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card, .card.soon { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--wall); outline: none; }
.card b { font: 700 19px "Noto Serif TC", serif; display: block; }
.card small { color: var(--muted); font-size: 13.5px; }
.card .arr { margin-left: auto; color: var(--wall); font-weight: 700; }
.soon { opacity: .55; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--wall); flex: none; }
.soon .dot { background: var(--line); }
footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Italia · 2027</p>
  <h1>義大利旅遊地圖</h1>
  <p class="lead">真地圖版：可以放大到每條巷子，也可以排每天的行程。</p>
  <ul>
    <li><a class="card" href="lucca/"><span class="dot"></span><span><b>盧卡 Lucca</b><small>古城景點、城牆、購物街</small></span><span class="arr">打開 →</span></a></li>
    <li><a class="card" href="rome/"><span class="dot"></span><span><b>羅馬 Roma</b><small>古羅馬遺跡、梵蒂岡、City Walk 散步路線、購物街</small></span><span class="arr">打開 →</span></a></li>
    <li><a class="card" href="rome-art/"><span class="dot"></span><span><b>羅馬藝術觀｜推論脈絡</b><small>古羅馬、中世紀、文藝復興、巴洛克一題接一題看懂，景點可連到羅馬地圖</small></span><span class="arr">打開 →</span></a></li>
    <li><div class="card soon"><span class="dot"></span><span><b>威尼斯 Venezia</b><small>準備中</small></span></div></li>
  </ul>
  <footer>行程和自己加的點只存在你自己的手機或電腦裡。</footer>
</main>
</body>
</html>
